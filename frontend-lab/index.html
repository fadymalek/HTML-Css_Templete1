<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frontend Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B1020; --bg2:#10173A; --panel:#151E44; --panel2:#1D2758; --line:#2C3874;
  --text:#F3F5FF; --soft:#AEB6E0; --dim:#737CB4;
  --html:#FF8A3D; --css:#4DA3FF; --js:#FFD43B; --mint:#3BE0A1; --coral:#FF6B7A; --violet:#A78BFA;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:clamp(14px, calc(.5vw + .8vh), 24px)}
body{
  margin:0;color:var(--text);font-family:var(--body);line-height:1.4;background-color:var(--bg);
  background-image:
    radial-gradient(900px 520px at 90% -10%, rgba(77,163,255,.18), transparent 60%),
    radial-gradient(760px 520px at -10% 110%, rgba(255,138,61,.12), transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--css);outline-offset:3px}
[hidden]{display:none!important}
.ar{display:block;direction:rtl;text-align:right;font-family:'Cairo',var(--body);font-weight:600;font-size:.86em;line-height:1.65;color:var(--soft);margin-top:4px;letter-spacing:0}
.ar b{color:inherit}
.inl{display:inline;margin:0 .4em 0 0}
.disc li.lit .ar{color:#CFF7E6}
.qprompt .ar{font-size:.62em;color:var(--soft);margin-top:8px;font-weight:700}
.qfeed .ar{border-top:1px dashed rgba(255,255,255,.18);padding-top:6px;margin-top:6px;color:var(--text)}
.opt .ar{font-size:.8em;margin-top:2px}
.tip .ar{color:var(--text);opacity:.85}
.panel h3 .ar,.crumb .ar{display:inline;font-size:.72em;margin:0 0 0 .5em;color:var(--dim)}
.tcard .ar{color:var(--soft)}
.tcard h2 .ar{display:block;font-size:.62em;color:var(--js)}

.screen{min-height:100vh;min-height:100dvh;max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:clamp(10px,1.6vh,18px) clamp(12px,2vw,28px);animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:1000px) and (min-height:600px){
  .screen.fit{height:100vh;height:100dvh}
  .screen.fit .work{flex:1;min-height:0}
  .screen.fit .work > *{min-height:0}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-family:var(--display);font-weight:800;font-size:1.05rem;
  padding:.45em 1em;border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;transition:transform .12s, background .2s, border-color .2s;line-height:1.1}
.btn:hover{transform:translateY(-2px);border-color:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#06281B}
.btn.ghost{background:transparent}
.btn.small{font-size:.9rem;padding:.35em .8em;border-radius:11px}
.btn.on{background:var(--css);border-color:var(--css);color:#04203F}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .crumb{flex:1;min-width:200px}
.top .crumb small{display:block;color:var(--dim);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.top .crumb b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.seg{display:inline-flex;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:.35em .9em;border-radius:10px;font-family:var(--display);font-weight:800;cursor:pointer;color:var(--soft);font-size:1rem}
.seg button.on{background:var(--text);color:var(--bg)}

.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-size:1.15rem;line-height:1.1}
.panel .sub{color:var(--soft);font-size:.9rem;margin:-6px 0 0}
.scroll{overflow:auto}

/* ---------- discover list ---------- */
.disc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:d}
.disc li{counter-increment:d;display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;border:2px dashed var(--line);color:var(--dim);font-weight:700;font-size:.95rem;transition:all .4s}
.disc li::before{content:counter(d);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-family:var(--display);font-weight:800;font-size:.9rem}
.disc li.lit{color:var(--text);border-style:solid;border-color:var(--mint);background:rgba(59,224,161,.09);animation:pop .5s}
.disc li.lit::before{content:'✓';background:var(--mint);color:#06281B}
.disc .prog{font-weight:800;color:var(--soft);font-size:.85rem}
.disc .prog b{color:var(--mint)}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.doneBox{border:2px solid var(--mint);background:rgba(59,224,161,.1);border-radius:14px;padding:10px;font-weight:800;display:flex;flex-direction:column;gap:8px}

/* ---------- layer colours ---------- */
.L-html{--c:var(--html)} .L-css{--c:var(--css)} .L-js{--c:var(--js)}
.tagc{display:inline-block;padding:.05em .55em;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:.85em;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}

/* ---------- code viewer ---------- */
.codebox{border:2px solid color-mix(in srgb,var(--c,var(--line)) 55%,var(--line));border-radius:14px;background:#0A0F24;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:opacity .3s, filter .3s}
.codebox .ch{display:flex;align-items:center;gap:8px;padding:6px 10px;background:color-mix(in srgb,var(--c,var(--line)) 16%,#0A0F24);font-weight:800;font-size:.9rem}
.codebox .ch .fn{font-family:var(--mono);color:var(--c,var(--soft))}
.codebox .ch .st{margin-left:auto;font-size:.75rem;color:var(--soft)}
.codebox.off{opacity:.35;filter:grayscale(.8)}
.cbody{overflow:auto;padding:6px 0;font-family:var(--mono);font-size:.78rem;line-height:1.55;min-height:0;flex:1;position:relative}
.ln{display:flex;white-space:pre;padding-right:10px;transition:background .3s}
.ln .no{flex:0 0 2.6em;text-align:right;padding-right:.9em;color:#475089;user-select:none}
.ln.hl{background:color-mix(in srgb,var(--c,var(--mint)) 28%,transparent);box-shadow:inset 4px 0 0 var(--c,var(--mint))}
.ln.dim{opacity:.32}
.cbody i{font-style:normal}
i.t{color:#FF9E64} i.p{color:#6E78B8} i.a{color:#7DCFFF} i.s{color:#9ECE6A} i.k{color:#C792EA} i.n{color:#FF9E64} i.c{color:#5A6399} i.sel{color:#FFC777} i.pr{color:#7DCFFF} i.f{color:#82AAFF}

/* ---------- browser frame ---------- */
.browser{border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.browser .bar{display:flex;align-items:center;gap:6px;background:#1A2350;padding:6px 10px;font-size:.8rem;color:var(--soft);font-family:var(--mono)}
.browser .bar i{width:10px;height:10px;border-radius:50%;display:inline-block;background:#FF6B7A}
.browser .bar i:nth-child(2){background:#FFD43B}.browser .bar i:nth-child(3){background:#3BE0A1}
.browser .bar span{margin-left:8px;background:#0E1536;padding:2px 10px;border-radius:8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser iframe{border:0;width:100%;flex:1;min-height:260px;background:#fff;display:block}

/* ---------- toggles ---------- */
.layerBar{display:flex;gap:10px;flex-wrap:wrap}
.ltog{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);cursor:pointer;text-align:left}
.ltog .sw{width:2.6em;height:1.45em;border-radius:99px;background:var(--c);position:relative;flex:0 0 auto;transition:background .2s}
.ltog .sw::after{content:'';position:absolute;top:.18em;left:1.3em;width:1.1em;height:1.1em;border-radius:50%;background:#fff;transition:left .2s}
.ltog b{font-family:var(--display);font-size:1.1rem;color:var(--c);display:block;line-height:1}
.ltog small{color:var(--soft);font-weight:700;font-size:.8rem}
.ltog.off{background:transparent;border-color:var(--line)}
.ltog.off .sw{background:#39406E}.ltog.off .sw::after{left:.18em}
.ltog.off b{color:var(--dim)}

.tip{border-radius:14px;padding:10px 12px;background:var(--panel2);border:2px solid var(--line);font-weight:700;min-height:3.2em}
.tip.good{border-color:var(--mint)} .tip.warn{border-color:var(--js)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
.hero h1{font-family:var(--display);font-size:clamp(2rem,4vw,3.2rem);line-height:1;margin:0}
.hero h1 span{background:linear-gradient(90deg,var(--html),var(--css),var(--js));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--soft);font-weight:700}
.trio{display:flex;gap:8px;flex-wrap:wrap}
.trio div{flex:1;min-width:120px;border-radius:14px;padding:8px 10px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.trio b{font-family:var(--display);color:var(--c);font-size:1.25rem;display:block;line-height:1}
.trio small{font-weight:700;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tcard{padding:14px;border-radius:20px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));display:flex;flex-direction:column;gap:8px}
.tcard .ic{font-size:2rem;line-height:1}
.tcard .num{color:var(--dim);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tcard h2{margin:0;font-family:var(--display);font-size:1.35rem;line-height:1.05}
.tcard p{margin:0;color:var(--soft);font-weight:700;font-size:.9rem;flex:1}
.tcard .row{display:flex;gap:8px;flex-wrap:wrap}
.tcard .row .btn{flex:1}
.stars{color:var(--js);letter-spacing:2px;font-size:1rem}
.stars .e{color:#39406E}
.tcard.exam{border-color:var(--violet);background:linear-gradient(180deg,rgba(167,139,250,.18),var(--bg2))}
.takeaway{font-weight:800;color:var(--soft);text-align:center;padding:6px}
.takeaway b{color:var(--text)}

/* ---------- layouts ---------- */
.work{display:grid;gap:12px}
.g-t1{grid-template-columns:1.25fr 1fr .8fr}
.g-t2{grid-template-columns:1fr 1fr .75fr}
.g-t3{grid-template-columns:.85fr 1.3fr .8fr}
.g-t4{grid-template-columns:1.6fr .9fr}
.g-t5{grid-template-columns:1.7fr .75fr}
@media (max-width:1000px){ .g-t1,.g-t2,.g-t3,.g-t4,.g-t5,.hero{grid-template-columns:1fr} }

/* T1 */
.t1stage{display:grid;grid-template-columns:1fr 9em;gap:10px;min-height:0;flex:1}
@media (max-width:700px){.t1stage{grid-template-columns:1fr}.t1stage .browser iframe{min-height:380px}.house{flex-direction:row}.house svg{max-width:9em}}
.house{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.house svg{width:100%;height:auto}
.house .lbl{font-size:.72rem;font-weight:800;text-align:center;line-height:1.3}
.house .lbl span{display:block;color:var(--dim);transition:color .3s}
.house .lbl span.on{color:var(--c)}
#hs .frame{stroke:var(--html);stroke-width:2.5;fill:none;transition:opacity .3s}
#hs .wall{fill:transparent;transition:fill .4s}
#hs.c-on .wall{fill:#4DA3FF}
#hs .roof{fill:transparent;transition:fill .4s}
#hs.c-on .roof{fill:#FF6B7A}
#hs .door{fill:transparent;transition:fill .4s}
#hs.c-on .door{fill:#8A5A2B}
#hs .win{fill:#1A2350;transition:fill .3s}
#hs.c-on .win{fill:#CFE8FF}
#hs.j-on .win{fill:#FFE98A}
#hs .glow{opacity:0;transition:opacity .3s}
#hs.j-on .glow{opacity:.55}
#hs.flash .glow{opacity:1}
#hs .wire{stroke:#555E99;stroke-width:2;fill:none;stroke-dasharray:4 3}
#hs.j-on .wire{stroke:var(--js)}
#hs.h-off .frame{opacity:.18;stroke-dasharray:4 4}
#hs.h-off .wall,#hs.h-off .roof,#hs.h-off .door,#hs.h-off .win{fill:transparent!important}
#hs.h-off .glow{opacity:0!important}
.codeStack{display:grid;grid-template-rows:1.25fr 1fr .8fr;gap:8px;min-height:0;flex:1}

/* T2 */
.edTabs{display:flex;gap:6px}
.edTabs button{flex:1;border:2px solid var(--c);background:transparent;color:var(--c);border-radius:12px 12px 0 0;padding:.35em;font-family:var(--mono);font-weight:700;cursor:pointer;opacity:.6}
.edTabs button.on{background:color-mix(in srgb,var(--c) 20%,transparent);opacity:1}
.editor{flex:1;min-height:300px;width:100%;resize:none;border-radius:0 0 14px 14px;border:2px solid var(--c);background:#0A0F24;color:#E6E9FF;font-family:var(--mono);font-size:.82rem;line-height:1.55;padding:10px;tab-size:2;white-space:pre;overflow:auto}
.editor:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
.console{font-family:var(--mono);font-size:.78rem;padding:7px 10px;border-radius:10px;background:#0A0F24;border:2px solid var(--line);color:var(--mint)}
.console.err{color:var(--coral);border-color:var(--coral)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mlist li{border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.mlist li .mh{display:flex;gap:8px;align-items:flex-start}
.mlist li .ck{flex:0 0 auto;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.mlist li.ok{border-color:var(--mint);background:rgba(59,224,161,.08)}
.mlist li.ok .ck{background:var(--mint);border-color:var(--mint);color:#06281B}
.mlist .hint{font-family:var(--mono);font-size:.75rem;color:var(--js);background:#0A0F24;border-radius:8px;padding:6px 8px;white-space:pre-wrap}
.mlist .hbtn{align-self:flex-start;font-size:.75rem;color:var(--soft);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.examNote{border:2px dashed var(--violet);border-radius:14px;padding:10px;font-size:.88rem;font-weight:700}
.examNote b{font-family:var(--display)}

/* T3 */
.mock{background:#F1F5FF;color:#1B2140;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-family:Arial,sans-serif;position:relative}
.mock .rg{position:relative;border-radius:10px;transition:box-shadow .3s, transform .3s;padding:10px}
.mock .rg.hdr{background:#3B5BDB;color:#fff}
.mock .rg.hdr h1{margin:0;font-size:1.4rem}
.mock .rg.nv{background:#fff;display:flex;gap:16px}
.mock .rg.nv a{color:#3B5BDB;font-weight:bold;text-decoration:underline}
.mock .rg.mn{background:#fff;min-height:7em}
.mock .rg.mn h2{margin:0 0 6px;font-size:1.15rem}
.mock .rg.mn p{margin:4px 0}
.mock .rg.ft{text-align:center;color:#666;font-size:.85rem}
.mock.tags .rg{box-shadow:0 0 0 3px var(--bc,#999)}
.mock.tags .rg::after{content:attr(data-tag);position:absolute;top:-.8em;right:8px;font-family:var(--mono);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--bc,#999);color:#0B1020}
.mock.div .rg{--bc:#9AA0B8}
.mock.sem .rg{--bc:var(--html)}
.mock .rg.speak{box-shadow:0 0 0 4px var(--js),0 0 22px rgba(255,212,59,.7)!important;transform:scale(1.015)}
.sr{border-radius:14px;padding:10px 12px;background:#0A0F24;border:2px solid var(--js);font-weight:800;min-height:3.4em;display:flex;gap:10px;align-items:center}
.sr .ic{font-size:1.5rem}
.serp{background:#fff;color:#202124;border-radius:14px;padding:12px;font-family:Arial,sans-serif;font-size:.9rem}
.serp .u{color:#4D5156;font-size:.75rem}
.serp .tt{color:#1A0DAB;font-size:1.15rem;margin:2px 0}
.serp .sl{display:flex;gap:14px;color:#1A0DAB;font-size:.85rem;margin-top:4px}
.robot{border-radius:14px;padding:10px 12px;background:var(--panel2);border:2px solid var(--line);font-weight:700;font-size:.9rem}
.robot ul{margin:4px 0 0;padding-left:1.2em}

/* T4 */
.devbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.devbar input[type=range]{flex:1;min-width:160px;accent-color:var(--css)}
.wlabel{font-family:var(--mono);font-weight:700;background:#0A0F24;border-radius:10px;padding:4px 10px;border:2px solid var(--line);min-width:11em;text-align:center}
.rstage{flex:1;min-height:340px;border-radius:16px;background:repeating-linear-gradient(45deg,#0E1536,#0E1536 12px,#111A40 12px,#111A40 24px);border:2px solid var(--line);position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.rdev{background:#000;border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:width .25s, height .25s}
.rdev.phone{border-radius:26px;padding:10px 6px}
.rdev .clip{overflow:hidden;border-radius:10px;background:#fff;width:100%;height:100%}
.rdev.phone .clip{border-radius:18px}
.rdev iframe{border:0;transform-origin:0 0;display:block;background:#fff}
.cblk{border-radius:10px;margin:2px 6px;transition:all .3s}
.cblk.act{background:rgba(77,163,255,.14);box-shadow:inset 4px 0 0 var(--css)}
.cblk.ina{opacity:.35}
.cblk.pulse{box-shadow:inset 4px 0 0 var(--js),0 0 0 2px var(--js)}

/* T5 */
.sTabs{display:flex;gap:8px;flex-wrap:wrap}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pal button{font-family:var(--mono);font-weight:700;font-size:.85rem;border:2px solid var(--violet);background:rgba(167,139,250,.14);color:#D9CCFF;border-radius:12px;padding:.45em .8em;cursor:pointer}
.pal button:hover{background:rgba(167,139,250,.3)}
.fwcanvas{background:#F1F5FF;color:#1B2140;border-radius:14px;padding:10px;min-height:12em;display:flex;flex-direction:column;gap:8px;font-family:Arial,sans-serif}
.fwcanvas .empty{color:#8890B0;text-align:center;margin:auto;font-weight:bold}
.cp{animation:drop .35s ease both;border-radius:10px}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.cp.nav{background:#3B5BDB;color:#fff;padding:10px;display:flex;justify-content:space-between;font-weight:bold}
.cp.nav span{color:#FFD43B}
.cp.card{background:#fff;padding:10px;border-left:6px solid #3B5BDB}
.cp.sign{display:flex;gap:10px;align-items:center}
.cp.sign button{background:#FF6B6B;color:#fff;border:0;border-radius:99px;padding:8px 16px;font-weight:bold;cursor:pointer}
.cp.foot{text-align:center;color:#666;font-size:.85rem;padding:6px}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:800;font-size:.85rem}
.meter .bar{height:14px;border-radius:99px;background:#0A0F24;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.upd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:#F1F5FF;color:#1B2140;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font-family:Arial,sans-serif;font-size:.85rem;position:relative}
.mini .part{background:#fff;border-radius:8px;padding:6px 8px;transition:background .2s}
.mini .part.h{background:#3B5BDB;color:#fff;font-weight:bold}

/* ---------- syntax highlight ---------- */
function hl(line, lang) {
  const e = esc(line);
  if (lang === 'html') {
    return e.replace(/(&lt;!--.*?--&gt;)|(&lt;\/?)([a-zA-Z][\w-]*)|(\s)([a-zA-Z-]+)(?==)|("[^"]*")|(\/?&gt;)/g,
      (m, com, lt, tag, sp, attr, str, gt) => {
        if (com) return `<i class="c">${com}</i>`;
        if (tag) return `<i class="p">${lt}</i><i class="t">${tag}</i>`;
        if (attr) return `${sp}<i class="a">${attr}</i>`;
        if (str) return `<i class="s">${str}</i>`;
        if (gt) return `<i class="p">${gt}</i>`;
        return m;
      });
  }
  if (lang === 'css') {
    if (/^\s*\/\*/.test(line)) return `<i class="c">${e}</i>`;
    let sel = '', rest = e;
    const k = e.indexOf('{');
    if (k >= 0) { sel = e.slice(0, k); rest = e.slice(k); }
    if (sel) sel = /@media/.test(sel) ? sel.replace(/(@media)(.*)/, '<i class="k">$1</i><i class="s">$2</i>') : `<i class="sel">${sel}</i>`;
    rest = rest.replace(/(\/\*.*?\*\/)|([a-z-]+)(\s*:)|(#[0-9a-fA-F]{3,8})\b|(\d+(?:\.\d+)?(?:px|%|em|rem|fr|vw)?)/g,
      (m, com, prop, col, hex, num) => {
        if (com) return `<i class="c">${com}</i>`;
        if (prop) return `<i class="pr">${prop}</i>${col}`;
        if (hex) return `<i class="n">${hex}</i>`;
        if (num) return `<i class="n">${num}</i>`;
        return m;
      });
    return sel + rest;
  }
  // js / jsx-ish
  return e.replace(/(\/\/.*$)|("[^"]*"|'[^']*'|`[^`]*`)|\b(let|const|var|function|return|if|else|new|true|false|null|import|from|export|default)\b|\b(\d+)\b|\.([a-zA-Z_]\w*)(?=\s*\()|(&lt;\/?)([A-Za-z][\w]*)/g,
    (m, com, str, kw, num, fn, lt, tag) => {
      if (com) return `<i class="c">${com}</i>`;
      if (str) return `<i class="s">${str}</i>`;
      if (kw) return `<i class="k">${kw}</i>`;
      if (num) return `<i class="n">${num}</i>`;
      if (fn) return `.<i class="f">${fn}</i>`;
      if (tag) return `<i class="p">${lt}</i><i class="t">${tag}</i>`;
      return m;
    });
}
function codeLines(code, lang, start = 1) {
  return code.split('\n').map((l, i) => `<div class="ln" data-n="${i + start}"><span class="no">${i + start}</span><span class="tx">${hl(l, lang) || ' '}</span></div>`).join('');
}
function scrollToLine(box, ln) {
  if (!box || !ln) return;
  box.scrollTop = Math.max(0, ln.offsetTop - box.clientHeight / 2);
}

function makeDiscover(total) {

    if (found.has(i)) return;
    found.add(i);

function cssRule(css, sel) {
  const m = css.match(new RegExp('(^|\\n)\\s*' + sel.replace(/\s+/g, '\\s+') + '\\s*\\{([^}]*)\\}'));
  return m ? m[2] : '';
}
function cssProp(rule, prop) { const m = rule.match(new RegExp('(^|[;\\s{])' + prop + '\\s*:\\s*([^;]+)')); return m ? m[2].trim().toLowerCase() : ''; }

   QUIZ ENGINE (mcq · type · place)
   - question order is shuffled every time
   - the same correct answer never comes many times in a row
   - answer options are shuffled (except fixed sets like True/False, HTML/CSS/JS)

const AR = s => s ? `<span class="ar">${s}</span>` : '';

      if (pick < 0) pick = 0;

    for (let k = 1; k < out.length; k++) { const a = answerKey(out[k]); if (a !== null && a === answerKey(out[k - 1])) rep++; }
