<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Algorithm Strategies Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface2:#F4F6FB; --line:#D3DAE8; --grid:#E8ECF4; --edge:#B3BED4;
  --ink:#152039; --ink2:#48546F; --ink3:#7F8BA6;
  --accent:#2C58E0; --accent-soft:#DDE6FF; --on-accent:#FFFFFF;
  --amber:#D48406; --amber-soft:#FFEDC9;
  --green:#12875E; --green-soft:#D2F0E2;
  --red:#CF3A52; --red-soft:#FCDDE3;
  --violet:#7450D4; --violet-soft:#EAE2FF;
  --teal:#0C8796; --teal-soft:#D0F0F2;
  --cell:#FFFFFF; --sq0:#F4EFE4; --sq1:#D5C6A6;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1221; --surface:#131B2F; --surface2:#19223A; --line:#27324F; --grid:#172039; --edge:#3D4A6E;
    --ink:#E6EBF7; --ink2:#A9B4CF; --ink3:#6F7C9C;
    --accent:#7392FF; --accent-soft:#1E2B5A; --on-accent:#0C1221;
    --amber:#F3B443; --amber-soft:#43320F;
    --green:#3CCB92; --green-soft:#113A2B;
    --red:#FF6B81; --red-soft:#461A26;
    --violet:#A88DFF; --violet-soft:#2C2253;
    --teal:#3DCFDF; --teal-soft:#0F3740;
    --cell:#161F36; --sq0:#2A3452; --sq1:#1A2239;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1221; --surface:#131B2F; --surface2:#19223A; --line:#27324F; --grid:#172039; --edge:#3D4A6E;
  --ink:#E6EBF7; --ink2:#A9B4CF; --ink3:#6F7C9C;
  --accent:#7392FF; --accent-soft:#1E2B5A; --on-accent:#0C1221;
  --amber:#F3B443; --amber-soft:#43320F;
  --green:#3CCB92; --green-soft:#113A2B;
  --red:#FF6B81; --red-soft:#461A26;
  --violet:#A88DFF; --violet-soft:#2C2253;
  --teal:#3DCFDF; --teal-soft:#0F3740;
  --cell:#161F36; --sq0:#2A3452; --sq1:#1A2239;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 20px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:0 8px}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.brand small{color:var(--ink3);font-size:12px}
.logo{width:38px;height:38px;flex:none}
.toc{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:1px}
.grp h3{margin:0 0 3px;padding:0 8px;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.toc a{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.3}
.toc a .sn{font:500 11px var(--mono);color:var(--ink3);min-width:20px}
.toc a:hover{background:var(--surface2);color:var(--ink)}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.toc a[aria-current="page"] .sn{color:var(--accent)}
.keys{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 8px;line-height:1.9}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface2);color:var(--ink2)}
main{padding-inline:clamp(16px,2.6vw,34px);padding-block:20px 36px;min-width:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- topic header ---------- */
.eyebrow{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3vw,36px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.desc{color:var(--ink2);max-width:82ch;margin:8px 0 0;font-size:15.5px}
.desc dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.desc dt{font-weight:600;color:var(--ink)}
.desc dd{margin:0}
.ex{font-size:14px;color:var(--ink2);margin:8px 0 0}
.ex span{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-right:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);font-weight:500;font-size:14px;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--ink);background:var(--surface2)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
.optbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:14px}
.optbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 316px;grid-template-areas:"stage side" "narr side" "ctrl ctrl";gap:12px 16px;align-items:start}
.stagebox{grid-area:stage;min-width:0;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.stage{min-width:0}
.stage svg{display:block;width:100%;height:auto;max-height:min(62vh,540px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);padding:0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--edge);background:var(--cell);vertical-align:-2px;margin-right:6px}
.legend i.cmp{background:var(--amber-soft);border-color:var(--amber)}
.legend i.ok{background:var(--green-soft);border-color:var(--green)}
.legend i.bad{background:var(--red-soft);border-color:var(--red)}
.legend i.act{background:var(--accent-soft);border-color:var(--accent)}
.legend i.vis{background:var(--violet-soft);border-color:var(--violet)}
.legend i.tealk{background:var(--teal-soft);border-color:var(--teal)}
.narr{grid-area:narr;font-size:17px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:3.6em}
.narr b{font-weight:700;color:var(--ink)}
.narr .g{color:var(--green)}
.narr .r{color:var(--red)}
.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 12px 7px;border-bottom:1px solid var(--line)}
.code ol{list-style:none;margin:0;padding:6px 0;counter-reset:ln;font:13px/1.6 var(--mono)}
.code li{counter-increment:ln;display:grid;grid-template-columns:2.4em minmax(0,1fr);padding:1px 10px 1px 0;white-space:pre-wrap;color:var(--ink2);transition:background .25s,color .25s}
.code li::before{content:counter(ln);color:var(--ink3);text-align:right;padding-right:.9em;font-size:11px}
.code li.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.code li.on::before{content:"▶";color:var(--accent)}
.code .cm{color:var(--ink3);font-weight:400}
.vl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;min-height:44px}
.var{font:13px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink2)}
.var b{color:var(--ink);font-weight:700}
.ctrl{grid-area:ctrl;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btns{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.btn.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-width:108px}
.prog{flex:1 1 220px;display:flex;align-items:center;gap:12px;min-width:0}
.prog input{flex:1;min-width:0;accent-color:var(--accent)}
.cnt{font:13px var(--mono);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.spd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.spd .seg button{padding:4px 9px;font:600 12px var(--mono)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;max-width:48%}
.pager a small{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.pager a:hover{border-color:var(--accent)}
.pager a.nx{margin-left:auto;text-align:right}

@media (max-width:1150px){.lab{grid-template-columns:minmax(0,1fr) 270px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .toc{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .grp{flex-direction:row;flex:none;gap:4px}
  .grp h3{display:none}
  .toc a{white-space:nowrap;border:1px solid var(--line)}
  .keys{display:none}
  .lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "narr" "ctrl" "side"}
  .narr{font-size:16px}
  .desc dl{grid-template-columns:1fr}
}

/* ---------- SVG visuals ---------- */
.viz{font-family:var(--mono);overflow:visible}
.viz text{fill:var(--ink);text-anchor:middle;font-size:16px}
.viz .l{text-anchor:start}
.viz .r{text-anchor:end}
.viz .lb{font-weight:600}
.viz .lg{font-size:22px}
.viz .xl{font-size:26px;font-weight:700}
.viz .sm{font-size:13px;fill:var(--ink2)}
.viz .mono{font-size:14px}
.viz .b{font-weight:700}
.viz .cap{font-size:12px;font-weight:600;letter-spacing:.1em;fill:var(--ink3)}
.viz .nd{font-size:18px}
.viz .gtxt{fill:var(--green);font-weight:700}
.viz .rtxt{fill:var(--red);font-weight:700}
.viz .atxt{fill:var(--accent);font-weight:700}
.viz .chg{fill:var(--amber);font-weight:700}
.it{transition:transform .55s cubic-bezier(.45,.05,.25,1),opacity .35s;animation:fadein .35s ease-out}
.it.fresh{transition:none}
.it.hide{opacity:0}
.it.dim{opacity:.28}
.it.ghost{opacity:.3}
@keyframes fadein{from{opacity:0}}
.bx{fill:var(--cell);stroke:var(--edge);stroke-width:1.6;transition:fill .3s,stroke .3s}
.cmp>.bx{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2.6}
.ok>.bx{fill:var(--green-soft);stroke:var(--green);stroke-width:2.2}
.bad>.bx{fill:var(--red-soft);stroke:var(--red);stroke-width:2.4}
.act>.bx{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
.vis>.bx{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2.2}
.k1>.bx{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.2}
.k2>.bx{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2.2}
.k3>.bx{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2.2}
.bst>.bx{stroke:var(--green);stroke-width:2.2;stroke-dasharray:5 4}
.ln{stroke:var(--edge);stroke-width:2.6;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}
.ah{fill:var(--edge);transition:fill .3s}
.wb{fill:var(--surface);stroke:var(--edge);stroke-width:1.2;transition:fill .3s,stroke .3s}
.viz .wt{font-size:13px;font-weight:700;fill:var(--ink2)}
.ed.cmp .ln{stroke:var(--amber);stroke-width:5}
.ed.cmp .ah{fill:var(--amber)}
.ed.cmp .wb{stroke:var(--amber);fill:var(--amber-soft)}
.ed.act .ln{stroke:var(--accent);stroke-width:4.5}
.ed.act .ah{fill:var(--accent)}
.ed.act .wb{stroke:var(--accent)}
.ed.ok .ln{stroke:var(--green);stroke-width:5}
.ed.ok .ah{fill:var(--green)}
.ed.ok .wb{stroke:var(--green);fill:var(--green-soft)}
.ed.bad .ln{stroke:var(--red);stroke-width:4.5;stroke-dasharray:8 6}
.ed.bad .wb{stroke:var(--red);fill:var(--red-soft)}
.ed.rej .ln{stroke:var(--red);stroke-width:2.5;stroke-dasharray:4 6;opacity:.55}
.ed.bst .ln{stroke:var(--green);stroke-width:3.5;stroke-dasharray:8 6}
.ptr{fill:var(--accent)}
.base{stroke:var(--ink3);stroke-width:2.5;stroke-linecap:round}
.brk{fill:none;stroke:var(--ink3);stroke-width:2}
.bdg{fill:var(--ink)}
.viz .bdt{fill:var(--bg);font-size:12px;font-weight:700}
.pill{fill:var(--surface);stroke:var(--edge);stroke-width:1.4}
.cmp>.pill{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2.4}
.sq{stroke:none;transition:fill .3s}
.sq0>.sq{fill:var(--sq0)}
.sq1>.sq{fill:var(--sq1)}
.att>.sq{fill:var(--red-soft)}
.dead>.sq{fill:var(--red-soft);stroke:var(--red);stroke-width:2}
.qn{fill:var(--ink);transition:fill .3s}
.cmp .qn{fill:var(--amber)}
.bad .qn{fill:var(--red)}
.ok .qn{fill:var(--green)}
.atkl{stroke:var(--red);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
.bit rect{fill:var(--cell);stroke:var(--edge);stroke-width:1.2}
.viz .bit text{font-size:13px;fill:var(--ink3)}
.bit.b1 rect{fill:var(--accent);stroke:var(--accent)}
.viz .bit.b1 text{fill:var(--on-accent);font-weight:700}
.bit.oa rect{fill:var(--accent-soft);stroke:var(--accent)}
.bit.ob rect{fill:var(--violet-soft);stroke:var(--violet)}
.viz .bit.oa text,.viz .bit.ob text{fill:var(--ink)}
.viz .bit.oa.b1 text,.viz .bit.ob.b1 text{font-weight:800}
.bit.mu rect{fill:var(--red);stroke:var(--red)}
.viz .bit.mu text{fill:#fff;font-weight:700}
.fbar{fill:var(--green)}
.cut{stroke:var(--red);stroke-width:3;stroke-linecap:round}
.cmp .rowbg{fill:var(--amber-soft);stroke:var(--amber)}
.ok .rowbg{fill:var(--green-soft);stroke:var(--green)}
.rowbg{fill:transparent;stroke:none;stroke-width:1.5}
.viz .tag{font-size:12px;fill:var(--amber);font-weight:700}
.axis{stroke:var(--edge);stroke-width:1.5}
.lbest{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}
.lavg{fill:none;stroke:var(--ink3);stroke-width:2;stroke-dasharray:5 4}
.dbest{fill:var(--accent)}
.sqf{fill:var(--cell);stroke:var(--edge);stroke-width:1.6}
.qc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.din{fill:none;stroke:var(--accent);stroke-linecap:round}
.dout{fill:none;stroke:var(--amber);stroke-linecap:round}
.piline{stroke:var(--green);stroke-width:1.6;stroke-dasharray:5 4}
.estl{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.fd>.bx{fill:var(--accent);stroke:var(--accent)}
.viz .fd text{fill:var(--on-accent)}
.star{fill:var(--amber);stroke:var(--amber);stroke-width:1;stroke-linejoin:round}
.barv{fill:var(--accent)}
.cmp .barv{fill:var(--amber)}
.hbar{fill:var(--violet)}
.act .hbar{fill:var(--amber)}
.avgl{stroke:var(--red);stroke-width:2.2;stroke-dasharray:7 5}
.arcp{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round}
.arch{fill:var(--amber)}
@media (prefers-reduced-motion: reduce){
  .it{transition:none!important;animation:none!important}
  .code li{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <a class="brand" href="#structure">
      <svg class="logo" viewBox="0 0 38 38" aria-hidden="true">
        <rect x="0.5" y="0.5" width="37" height="37" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <path d="M19 10 L11 21 M19 10 L27 21 M11 21 L15 29" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="19" cy="10" r="4" fill="var(--accent)"/><circle cx="11" cy="21" r="4" fill="var(--accent)"/>
        <circle cx="27" cy="21" r="4" fill="var(--amber)"/><circle cx="15" cy="29" r="3.4" fill="var(--green)"/>
      </svg>
      <span><b>Algorithm Strategies</b><small>Step-by-step lab · slides 43–48</small></span>
    </a>
    <nav class="toc" id="toc" aria-label="Topics"></nav>
    <div class="keys"><b>Keyboard</b><br><kbd>→</kbd> next step · <kbd>←</kbd> back<br><kbd>Space</kbd> play / pause · <kbd>Home</kbd> restart<br><kbd>PgDn</kbd> / <kbd>PgUp</kbd> next / previous topic</div>
  </aside>
  <main><div class="wrap" id="main"></div></main>
</div>

<script>
'use strict';
/* =========================================================
   Drawing helpers
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1 = n => Math.round(n * 10) / 10;
const T = (x, y, s, c = 'lb') => `<text x="${r1(x)}" y="${r1(y)}" dy=".35em" class="${c}">${s}</text>`;
const R = (w, h, c = 'bx', rx = 7) => `<rect class="${c}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${rx}"/>`;
const CELL = (w, h, s, c = 'lb') => R(w, h) + T(0, 0, s, c);
const NODE = (r, s) => `<circle class="bx" r="${r}"/>` + T(0, 0, s, 'lb nd');
const inf = v => v === Infinity ? '∞' : v;
const ek = (u, v) => u < v ? u + v : v + u;
const clone = o => JSON.parse(JSON.stringify(o));
const PTR = (lab) => `<path class="ptr" d="M0 -12 L8 1 H-8Z"/>` + T(0, 14, lab, 'mono b');

function EDGE(x1, y1, x2, y2, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const off = o.off || 0, r = o.r || 0;
  const ax = x1 + px * off + ux * r, ay = y1 + py * off + uy * r;
  const bx = x2 + px * off - ux * r, by = y2 + py * off - uy * r;
  let ex = bx, ey = by, head = '';
  if (o.dir) {
    ex = bx - ux * 12; ey = by - uy * 12;
    head = `<polygon class="ah" points="${r1(bx)},${r1(by)} ${r1(ex + px * 6.5)},${r1(ey + py * 6.5)} ${r1(ex - px * 6.5)},${r1(ey - py * 6.5)}"/>`;
  }

const monteCarlo = {
  vb: '0 0 800 400',
  code: ['inside ← 0', 'repeat N times:', '  x, y ← random numbers in [0, 1)', '  if x² + y² ≤ 1: inside ← inside + 1', 'π ≈ 4 × inside / N          ▸ approximate'],
  legend: [['act', 'dart inside the quarter circle'], ['cmp', 'dart outside']],
  opts: [{ id: 'seed', type: 'seed', label: 'New random darts', def: 11 }],
  build(o) {
    const R = rng(o.seed), NS = [0, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000], pts = [];
    for (let i = 0; i < 5000; i++) { const x = R(), y = R(); pts.push([x, y, x * x + y * y <= 1]); }
    const S = [], est = []; let inside = 0, n = 0;
    NS.forEach(N => {
      while (n < N) { if (pts[n][2]) inside++; n++; }
      const e = N ? 4 * inside / N : null; if (e != null) est.push(e);
      S.push({ N, inside, e, est: [...est], pts, line: N ? [1, 2, 3, 4] : 0,
        msg: N === 0 ? 'Throw random darts at a 1 × 1 square. The quarter circle covers π/4 of the square, so about π/4 of the darts should land inside it.'
          : `${N} dart${N > 1 ? 's' : ''}: ${inside} inside → π ≈ 4 × ${inside} / ${N} = <b>${e.toFixed(4)}</b> (off by ${Math.abs(e - Math.PI).toFixed(4)}).`,
        vars: { N, inside, 'π estimate': e == null ? '—' : e.toFixed(4) } });
    });
    const last = S[S.length - 1];
    S.push({ ...last, line: 4, msg: `More random samples → better estimate, but it is never exact. That is <b>Monte Carlo</b>: a fixed amount of work and an answer that is probably close. (π = 3.14159…)` });

  },

    const pi = [], po = [];
    for (let i = 0; i < s.N; i++) { const [x, y, inn] = s.pts[i]; (inn ? pi : po).push(`M${r1(x0 + x * W)} ${r1(y0 + W - y * W)}h0`); }
    const sw = s.N <= 20 ? 12 : s.N <= 200 ? 7 : s.N <= 1000 ? 5 : 3.5;
    it.push({ k: 'din', z: 1, h: `<path class="din" stroke-width="${sw}" d="${pi.join('')}"/><path class="dout" stroke-width="${sw}" d="${po.join('')}"/>` });
    const X = 420;
    it.push({ k: 'n1', x: X, y: 52, h: T(0, 0, 'DARTS', 'cap l') + T(0, 30, s.N, 'xl l') });
    it.push({ k: 'n2', x: X + 140, y: 52, h: T(0, 0, 'INSIDE', 'cap l') + T(0, 30, s.inside, 'xl l atxt') });
    it.push({ k: 'n3', x: X, y: 140, h: T(0, 0, 'π ≈ 4 × inside / darts', 'mono l') + T(0, 36, s.e == null ? '—' : s.e.toFixed(4), 'xl l') });

      T(784, CY(Math.PI), 'π', 'sm l') + T(420, CY(4), '4', 'sm r') + T(420, CY(2), '2', 'sm r') + T(425, 244, 'ESTIMATE AS DARTS INCREASE', 'cap l');
    if (s.est.length) ch += `<polyline class="estl" points="${s.est.map((e, i) => CX(i) + ',' + r1(CY(e))).join(' ')}"/>` + s.est.map((e, i) => `<circle class="dbest" cx="${CX(i)}" cy="${r1(CY(e))}" r="3"/>`).join('');

const STAR = r => { let p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p.push(r1(Math.cos(a) * rr) + ',' + r1(Math.sin(a) * rr)); } return `<polygon class="star" points="${p.join(' ')}"/>`; };
const lasVegas = {
  vb: '0 0 800 400',
  code: ['input: 12 cards, 3 hide a ★ (random places)', 'repeat:', '  flip a random unopened card', '  if it shows ★: return it     ▸ always correct'],
  legend: [['ok', 'star found'], ['bad', 'empty card']],
  opts: [{ id: 'seed', type: 'seed', label: 'New random runs', def: 3 }],
  build(o) {
    const R = rng(o.seed), S = [], runs = [];
    S.push({ line: 0, run: 0, open: [], stars: [], runs: [], msg: '12 face-down cards, 3 of them hide a ★. Task: find any ★. Strategy: flip random cards until you hit one. We repeat this 5 times.' });
    for (let r = 1; r <= 5; r++) {
      const stars = shuffle([...Array(12).keys()], R).slice(0, 3), order = shuffle([...Array(12).keys()], R), open = [];
      S.push({ line: 0, run: r, open: [], stars, runs: [...runs], msg: `Run ${r}: the stars are hidden in new random places.` });
      for (const c of order) {

          runs.push(open.length);
          S.push({ line: [2, 3], run: r, open: [...open], stars, runs: [...runs], msg: `Card ${c + 1} shows a ★ after <b>${open.length} ${open.length > 1 ? 'tries' : 'try'}</b>. The answer is guaranteed to be correct.`, vars: { run: r, tries: open.length } });
          break;
        }
        S.push({ line: [1, 2], run: r, open: [...open], stars, runs: [...runs], msg: `Flip a random card (#${c + 1}): empty. Try again.`, vars: { run: r, tries: open.length } });
      }
    }
    S.push({ line: -1, run: 6, open: [], stars: [], runs: [...runs], msg: `Tries per run: ${runs.join(', ')}. Every answer was correct; only the <b>running time</b> was random. That is a <b>Las Vegas</b> algorithm. Monte Carlo is the opposite: fixed time, answer only probably right.` });
    return S;
  },
  render(s) {
    const it = [], X = c => 80 + (c % 4) * 96, Y = c => 82 + Math.floor(c / 4) * 118;

    }
    it.push({ k: 'ht', x: 490, y: 36, h: T(0, 0, 'TRIES NEEDED PER RUN', 'cap l') });
    for (let r = 1; r <= 5; r++) {

      it.push({ k: 'h' + r, x: 490, y: 76 + (r - 1) * 48, c: cur ? 'act' : '', h: T(0, 0, 'run ' + r, 'sm l') + `<rect class="hbar" x="56" y="-11" width="${t * 18}" height="22" rx="4"/>` + T(64 + t * 18, 0, t || '', 'lb l') });
    }

    if (b.dataset.sp) {
      speed = +b.dataset.sp; try { localStorage.setItem('as-speed', speed); } catch (err) {}
      host.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (timer) play();
      return;
    }
    const a = b.dataset.a;
    if (a === 'play') timer ? pause() : play();
    else if (a === 'prev') { pause(); show(i - 1); }
    else if (a === 'next') { pause(); show(i + 1); }
    else if (a === 'restart') { pause(); show(0); }
  });
  range.addEventListener('input', () => { pause(); show(+range.value); });
  setPlayUI(false);
  rebuild();
  return {
    next() { pause(); show(i + 1); }, prev() { pause(); show(i - 1); },
    toggle() { timer ? pause() : play(); }, restart() { pause(); show(0); }, destroy: pause
  };
}

/* =========================================================
   Navigation
   ========================================================= */
const main = document.getElementById('main'), toc = document.getElementById('toc');
const tabMem = {};
(() => {
  const groups = {};
  TOPICS.forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  toc.innerHTML = Object.entries(groups).map(([g, ts]) => `<div class="grp"><h3>${esc(g)}</h3>${ts.map(t => `<a href="#${t.id}" data-id="${t.id}"><span class="sn">${t.slide}</span>${esc(t.nav)}</a>`).join('')}</div>`).join('');
})();

function showTopic(t) {
  if (current) current.destroy();
  const idx = TOPICS.indexOf(t), prev = TOPICS[idx - 1], next = TOPICS[idx + 1];
  toc.querySelectorAll('a').forEach(a => a.dataset.id === t.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  main.innerHTML = `
    <header>
      <div class="eyebrow">Slide ${t.slide} · ${esc(t.group)}</div>
      <h1>${esc(t.title)}</h1>
      <div class="desc">${t.desc}</div>
      <p class="ex"><span>Example</span>${esc(t.ex)}</p>
    </header>
    <div class="bar"><div class="seg" role="tablist" ${t.demos.length < 2 ? 'hidden' : ''}>${t.demos.map(([n], i) => `<button role="tab" data-i="${i}">${esc(n)}</button>`).join('')}</div><div class="opts" id="optsHost"></div></div>
    <div id="labhost"></div>
    <nav class="pager">${prev ? `<a href="#${prev.id}"><small>← Previous</small>${esc(prev.nav)}</a>` : ''}${next ? `<a class="nx" href="#${next.id}"><small>Next →</small>${esc(next.nav)}</a>` : ''}</nav>`;
  const tabs = main.querySelectorAll('[role=tab]'), labhost = main.querySelector('#labhost'), optsHost = main.querySelector('#optsHost');
  function load(i) {
    tabMem[t.id] = i;
    tabs.forEach(b => b.setAttribute('aria-selected', +b.dataset.i === i));
    if (current) current.destroy();
    current = mountLab(labhost, t.demos[i][1], optsHost);
  }
  tabs.forEach(b => b.onclick = () => load(+b.dataset.i));
  load(tabMem[t.id] || 0);
}
function route() {
  const id = location.hash.slice(1);
  const t = TOPICS.find(x => x.id === id) || TOPICS[0];
  showTopic(t);
  window.scrollTo(0, 0);
}
function goTopic(d) {
  const id = location.hash.slice(1), i = Math.max(0, TOPICS.findIndex(x => x.id === id));
  const t = TOPICS[i + d]; if (t) location.hash = t.id;
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (!current || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); current.next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); current.prev(); }
  else if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); current.toggle(); }
  else if (e.key === 'Home') { e.preventDefault(); current.restart(); }
  else if (e.key === 'PageDown') { e.preventDefault(); goTopic(1); }
  else if (e.key === 'PageUp') { e.preventDefault(); goTopic(-1); }
});
route();
</script>
