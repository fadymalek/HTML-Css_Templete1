<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Circuit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0A0F2E; --ink2:#0F1540; --stage:#121A4B; --panel:#18215C; --panel2:#212B74; --line:#2E3A92;
  --text:#F4F5FF; --soft:#B3BAEC; --dim:#737CBE;
  --volt:#FFD23F; --mint:#3BE0A1; --coral:#FF6B7A; --sky:#5CC8FF; --copper:#E4833F; --wire:#6477FF;
  --display:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(14px, calc(.55vw + .85vh), 26px)}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);font-family:var(--body);font-size:1rem;line-height:1.4;
  background-color:var(--ink);
  background-image:
    radial-gradient(900px 520px at 88% -8%, rgba(100,119,255,.24), transparent 62%),
    radial-gradient(760px 520px at -12% 108%, rgba(59,224,161,.10), transparent 60%),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit}
.screen{height:100vh;height:100dvh;max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(6px,1.3vh,16px);padding-inline:clamp(14px,2.2vw,32px);padding-block:clamp(8px,1.8vh,20px);animation:fadein .35s ease both}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-family:var(--display);font-weight:800;font-size:1.15rem;
  border:0;border-radius:999px;padding:.45em 1.3em;min-height:3.1rem;white-space:nowrap;cursor:pointer;text-decoration:none;
  background:var(--panel2);color:var(--text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);transition:transform .12s ease, filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--volt);color:#211a00}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:1rem;min-height:2.7rem;padding:.3em 1em}
.iconbtn{flex:none;width:2.9rem;height:2.9rem;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:1.45rem;height:1.45rem;fill:currentColor}
.iconbtn:hover{border-color:var(--soft)}

/* ---------- map ---------- */
.maphead{display:flex;align-items:center;gap:.7rem}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.logo svg{width:1.7rem;height:1.7rem;fill:var(--volt);filter:drop-shadow(0 0 8px rgba(255,210,63,.6))}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(12px,2.6vw,44px);align-items:center}
.kicker{margin:0 0 .3rem;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,min(9vh,6.5vw),5.4rem);line-height:.95;margin:0;letter-spacing:-.01em}
.brand .q{color:var(--volt);text-shadow:0 0 28px rgba(255,210,63,.5)}
.lede{color:var(--soft);font-size:1.05rem;max-width:46ch;margin:.5em 0 .9em;font-weight:700}
.cta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.tip{color:var(--dim);font-weight:700;font-size:.8rem;margin:0;max-width:30ch}
.tip code{color:var(--soft);background:var(--panel);padding:1px 5px;border-radius:5px}
.labcell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:1.6rem;padding:clamp(10px,1.8vh,20px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px)}
.lc-top{display:flex;gap:.8rem;align-items:center}
.lc-top .volty{width:4rem;height:4rem;flex:none}
.lc-top p{margin:0;font-weight:700;color:var(--soft)}
.lc-top b{color:var(--text)}
.bigcell{display:flex;align-items:center}
.bc-body{flex:1;height:3rem;border:4px solid var(--soft);border-radius:14px;padding:4px;position:relative;overflow:hidden;background:var(--ink2)}
.bc-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),var(--volt));box-shadow:0 0 22px rgba(255,210,63,.45);min-width:6px;transition:width .8s ease}
.bc-ticks{position:absolute;inset:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),var(--ink2) calc(10% - 3px) 10%)}
.bc-nub{width:10px;height:1.5rem;background:var(--soft);border-radius:0 6px 6px 0}
.bc-cap{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;color:var(--soft);font-size:.9rem}
.bc-cap b{color:var(--volt);font-family:var(--display);font-size:1.25rem}
.missions{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,16px)}
.mcard{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.35rem;padding:clamp(10px,1.7vh,18px);border-radius:1.4rem;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--line);text-decoration:none;transition:transform .15s ease,border-color .15s}
.mcard:hover{transform:translateY(-4px);border-color:var(--volt)}
.mcard.next{border-color:var(--volt);box-shadow:0 0 0 3px rgba(255,210,63,.18),0 0 30px rgba(255,210,63,.12)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.mnum{font-family:var(--display);font-weight:800;font-size:1.15rem;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;background:var(--ink2);border:2px solid var(--line);flex:none}
.mcard.done .mnum{background:var(--volt);color:#211a00;border-color:var(--volt);box-shadow:0 0 18px rgba(255,210,63,.5)}
.diff{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.dbat{display:inline-flex;gap:2px;padding:2px;border:2px solid var(--soft);border-radius:5px;position:relative;margin-right:4px}
.dbat::after{content:"";position:absolute;right:-6px;top:50%;width:3px;height:7px;transform:translateY(-50%);background:var(--soft);border-radius:0 2px 2px 0}
.dbat i{width:5px;height:11px;border-radius:1px;background:rgba(255,255,255,.1)}
.dbat i.on{background:var(--dc)}
.mname{font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,2.9vh,1.45rem);line-height:1.05;margin:.2rem 0 0}
.mdesc{color:var(--soft);margin:0;font-size:.88rem;font-weight:700;flex:1;min-height:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mfoot{display:flex;justify-content:space-between;align-items:center}
.bolts{display:flex;gap:2px}
.bolt{width:1.35rem;height:1.35rem;fill:rgba(255,255,255,.14)}
.bolt.on{fill:var(--volt);filter:drop-shadow(0 0 5px rgba(255,210,63,.6))}
.play{font-family:var(--display);font-weight:800;color:var(--volt);font-size:1rem}

/* ---------- level: header · goal · stage · dock ---------- */
.lvhead{display:flex;align-items:center;gap:.8rem;flex:none}
.lvtitle{flex:1;min-width:0}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.lvtitle h1{font-family:var(--display);font-size:clamp(1.3rem,4.2vh,2.3rem);margin:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:40vw}
.dots i{width:.85rem;height:.85rem;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.dots i.done{background:var(--mint);border-color:var(--mint)}
.dots i.now{background:var(--volt);border-color:var(--volt);box-shadow:0 0 10px rgba(255,210,63,.7)}
.goal{flex:none;min-height:2.5em;display:flex;flex-direction:column;justify-content:center;font-family:var(--display);font-size:clamp(1rem,3vh,1.5rem);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.goal b{color:var(--volt)}
.goal-s{display:block;font-family:var(--body);font-size:.85rem;color:var(--soft);font-weight:700;margin-top:2px}
.stagebox{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.stage{width:min(100%, calc((100vh - 17rem) * 1000 / 560));width:min(100cqw, calc(100cqh * 1000 / 560));aspect-ratio:1000/560;
  background:var(--stage);border:3px solid var(--line);border-radius:clamp(14px,2vh,26px);overflow:hidden;position:relative;
  box-shadow:0 22px 50px rgba(0,0,0,.35);transition:border-color .25s}
.stage.good{border-color:var(--mint)} .stage.bad{border-color:var(--coral)} .stage.warn{border-color:var(--volt)}
.stage.bare{width:100%;height:100%;aspect-ratio:auto;background:none;border:0;box-shadow:none;overflow:visible;border-radius:0}
.stage.enter>*{animation:fadein .3s ease both}
svg.board{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stage>svg.board{height:100%}
svg.board.drag{touch-action:none}
.dock{flex:none;height:clamp(6.6rem,18vh,8.4rem);display:flex;align-items:stretch;gap:clamp(8px,1.2vw,16px)}
.talk{flex:1 1 16rem;min-width:13rem;display:flex;gap:.7rem;align-items:center}
.talk .volty{flex:none;width:3.6rem;height:3.6rem}
#vbox{flex:none;display:flex}
.bubble{position:relative;flex:1;max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:1.1rem;padding:.55rem .9rem;
  font-size:1.1rem;font-weight:700;line-height:1.3;min-height:3.2rem;display:flex;align-items:center;transition:border-color .2s}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--panel);border-left:2px solid;border-bottom:2px solid;border-color:inherit;transform:translateY(-50%) rotate(45deg)}
.bubble.good{border-color:var(--mint)} .bubble.bad{border-color:var(--coral)} .bubble.warn{border-color:var(--volt)}
.tray{flex:0 1 auto;min-width:0;display:flex;gap:.55rem;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:3px}
.tray:empty,.actions:empty{display:none}
.tray:has(.chip){flex-wrap:wrap;align-content:center;max-width:34rem}
.part{touch-action:none;flex:none;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.35rem .35rem .4rem;border-radius:1rem;border:3px solid var(--line);
  background:var(--panel);color:var(--text);cursor:grab;transition:transform .12s,border-color .12s;width:6.8rem}
.part:hover{transform:translateY(-2px);border-color:var(--soft)}
.part.sel{border-color:var(--volt);box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.part.lifted{opacity:.3}
.part .icon{display:block;width:100%;flex:1;min-height:0;background:var(--stage);border-radius:.7rem}
.part .icon svg{width:100%;height:100%;display:block}
.pname{font-family:var(--display);font-weight:800;font-size:.85rem;line-height:1.05;text-align:center}
.pname small{display:block;font-family:var(--body);font-size:.68rem;color:var(--soft);font-weight:700;margin-top:1px}
.part.tool{width:9rem}
.drag-ghost{position:fixed;left:0;top:0;margin:0;z-index:50;pointer-events:none;transform:scale(1.06) rotate(-3deg);filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));opacity:.95}
.actions{flex:none;display:flex;flex-direction:column;gap:.5rem;justify-content:center;min-width:10rem}
.traynote{color:var(--soft);font-weight:700;margin:0;align-self:center;max-width:14rem}

/* mission 1 cards */
.cards{height:100%;display:grid;gap:clamp(8px,1.4vh,16px);grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.cards.six{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.ccard{position:relative;min-height:0;display:flex;flex-direction:column;gap:2px;padding:6px 6px 8px;background:var(--stage);border:3px solid var(--line);border-radius:1.3rem;color:var(--text);cursor:pointer;text-align:center;transition:transform .12s,border-color .15s}
.ccard svg.board{flex:1;min-height:0;height:100%}
.ccard:hover:not(:disabled){transform:translateY(-3px)}
.ccard:disabled{cursor:default}
.ccard.picked{border-color:var(--volt);box-shadow:0 0 0 4px rgba(255,210,63,.18)}
.ccard.right{border-color:var(--mint)} .ccard.wrong{border-color:var(--coral)} .ccard.missed{border-color:var(--volt);border-style:dashed}
.cnum{position:absolute;left:10px;top:8px;font-family:var(--display);font-weight:800;width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--panel2);font-size:1rem}
.ccard.picked .cnum{background:var(--volt);color:#211a00}
.cap{flex:none;font-weight:800;font-size:.88rem;line-height:1.2;min-height:2.4em;padding:0 8px;color:var(--soft)}
.ccard.right .cap b{color:var(--mint)} .ccard.wrong .cap b{color:var(--coral)} .ccard.missed .cap b{color:var(--volt)}

/* mission 2 */
.det{height:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:clamp(10px,1.6vw,20px);align-items:stretch}
.det-mid{min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px)}
.bin{min-height:0;border-radius:1.6rem;border:3px dashed;display:flex;flex-direction:column;align-items:center;gap:4px;padding:1rem .8rem;color:var(--text);cursor:pointer;transition:transform .15s, background .15s}
.bin.cond{border-color:var(--mint);background:rgba(59,224,161,.07)}
.bin.ins{border-color:var(--coral);background:rgba(255,107,122,.07)}
.bin.over,.bin:hover{transform:scale(1.02)}
.bin.cond.over{background:rgba(59,224,161,.18)} .bin.ins.over{background:rgba(255,107,122,.18)}
.bin-h{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4vh,2rem);line-height:1.1}
.bin.cond .bin-h{color:var(--mint)} .bin.ins .bin-h{color:var(--coral)}
.bin-s{color:var(--soft);font-weight:800;font-size:.95rem}
.bin-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-end;font-size:clamp(1.5rem,4.5vh,2.4rem);margin-top:auto;padding-top:.6rem}
.tester{flex:1;min-height:0;width:100%;background:var(--stage);border:3px solid var(--line);border-radius:1.3rem;overflow:hidden;transition:border-color .15s}
.tester svg.board{height:100%}
.tester.over{border-color:var(--volt)}
.token{flex:none;touch-action:none;cursor:grab;background:var(--panel2);border:3px solid var(--volt);border-radius:1.4rem;padding:.3rem 1.6rem .5rem;display:flex;flex-direction:column;align-items:center;color:var(--text);box-shadow:0 12px 26px rgba(0,0,0,.35);min-width:11rem}
.token .te{font-size:clamp(2.4rem,8vh,4.2rem);line-height:1.15}
.token .tn{font-family:var(--display);font-weight:800;font-size:1.15rem}
.token.shake{animation:shake .45s}
.token.lifted{opacity:.3}

/* mission 9 */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:.4rem;width:min(46rem,58vw);height:100%}
.opt{min-height:0;border-radius:.9rem;border:2px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--display);font-weight:700;font-size:.9rem;line-height:1.1;cursor:pointer;padding:.25rem .6rem;text-align:left;transition:border-color .15s, transform .12s}
.opt:hover:not(:disabled){border-color:var(--volt);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--coral);opacity:.55;text-decoration:line-through}
.opt.right{border-color:var(--mint);background:rgba(59,224,161,.15)}

/* small screens: fall back to a scrolling page */
@media (max-width:700px){
  body{overflow:auto}
  .screen{height:auto;min-height:100dvh}
  .hero{grid-template-columns:1fr}
  .missions{flex:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .stagebox{flex:none;container-type:normal;display:block}
  .stage{width:100%}
  .stage.bare{height:auto}
  .cards,.cards.six{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .det{height:auto;grid-template-columns:1fr 1fr}
  .det-mid{grid-column:1/-1;order:-1}
  .bin{min-height:9rem}
  .tester{flex:none}
  .dock{height:auto;flex-wrap:wrap}
  .tray{flex-wrap:wrap;overflow:visible;justify-content:center;width:100%}
  .part .icon{flex:none;height:4.5rem}
  .actions{flex-direction:row;width:100%;flex-wrap:wrap}
  .opts{width:100%;grid-template-columns:1fr 1fr}
  .opt{min-height:2.8rem}
  .dots{max-width:none}
}

/* win overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,9,30,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.wincard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--volt);border-radius:30px;padding:26px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 60px rgba(255,210,63,.25);animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.wincard .volty{width:96px;height:96px}
.wincard h2{font-family:var(--display);font-size:2.2rem;margin:4px 0 6px;line-height:1}
.wincard p{color:var(--soft);font-weight:700;margin:10px 0 0}
.winbolts{display:flex;justify-content:center;gap:8px}
.winbolts .bolt{width:52px;height:52px}
.winbolts .bolt.on{animation:popin .5s both}
.winbolts .bolt:nth-child(2){animation-delay:.15s}.winbolts .bolt:nth-child(3){animation-delay:.3s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* mascot */
.volty{animation:bob 3.2s ease-in-out infinite}

/* ---------- SVG parts ---------- */
.w-out{fill:none;stroke:#060920;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.w-in{fill:none;stroke:var(--wire);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.w-red{fill:none;stroke:#FF4D64;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.w-blue{fill:none;stroke:#3FA9FF;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#FFF0A8;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 23;animation:flow .8s linear infinite}
.flow.rev{animation-direction:reverse}
.cut{fill:var(--stage)}
.joint{fill:#D5D9F2}
.leg{fill:none;stroke:#D5D9F2;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.leg.big{stroke-width:9}
.holder{fill:#394282;stroke:#5463C4;stroke-width:2}
.screw{fill:#B9BDD8}
.glass{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.55);stroke-width:2.5}
.glass.lit{stroke:#fff}
.fil{fill:none;stroke:#7D82A8;stroke-width:2.5;stroke-linejoin:round}
.fil.lit{stroke:#fff}
.bat-body{fill:#262F78;stroke:#4B58BD;stroke-width:3}
.bt-p{font:800 26px var(--display);fill:#2a2000}
.bt-m{font:800 30px var(--display);fill:var(--sky)}
.bt-v{font:800 17px var(--display);fill:#fff}
.res{fill:#EAD3A8;stroke:#B8976A;stroke-width:2.5}
.shield{fill:var(--mint);stroke:#0d5a3f;stroke-width:1.5}
.sw-base{fill:#232B6E;stroke:#3F4AA6;stroke-width:2}
.lever{stroke:#E8EBFF;stroke-width:7;stroke-linecap:round}
.knob{fill:var(--coral)}
.tip{fill:var(--copper)}
.socket{fill:rgba(255,210,63,.06);stroke:var(--volt);stroke-width:3;stroke-dasharray:8 7;animation:pulse 1.6s ease-in-out infinite}
.socket-q{font:800 28px var(--display);fill:var(--volt)}
.socket-q.sm{font-size:17px}
.probe-e{font-size:40px}
.hit{fill:transparent;transition:fill .15s}
.slot.tap{cursor:pointer}
.slot.tap:hover .hit,.hit.over{fill:rgba(255,210,63,.13)}
.ring{fill:none;stroke:var(--coral);stroke-width:5;animation:ringp 1s ease-in-out infinite}
.ring.good{stroke:var(--mint)}
.sparks path{fill:none;stroke:#FFE58A;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;animation:flick .16s steps(2) infinite}
.sparks path:nth-child(2){animation-delay:.08s}
.smoke circle{fill:rgba(170,170,190,.5);animation:smoke 1.8s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:.6s}.smoke circle:nth-child(3){animation-delay:1.2s}
.waves path{fill:none;stroke:var(--sky);stroke-width:4;stroke-linecap:round;animation:wave .8s ease-out infinite}
.waves path:nth-child(2){animation-delay:.25s}.waves path:nth-child(3){animation-delay:.5s}
.legtxt{font:800 22px var(--display);fill:var(--soft)}
.pad{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.55);stroke-width:3;stroke-dasharray:6 6;animation:pulse 1.4s ease-in-out infinite}
.wend{stroke:#fff;stroke-width:4;cursor:grab}
.wend.red{fill:#FF4D64} .wend.blue{fill:#3FA9FF}
.wend.idle{animation:pulse 1.2s ease-in-out infinite}
.flipb{cursor:pointer}
.flipc{fill:var(--volt);stroke:#211a00;stroke-width:2}
.flipi{fill:none;stroke:#211a00;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tag-t{font:800 17px var(--display);fill:#141a40}
.swl{font:800 16px var(--display);fill:var(--soft)}
.swg{cursor:pointer}
.swg:hover .hit{fill:rgba(255,210,63,.13)}
.g-t{font:800 17px var(--display);fill:var(--soft)}
.g-l{font:800 15px var(--display)}
.needle{stroke:#fff;stroke-width:6;stroke-linecap:round}
.plus-mark{font:800 34px var(--display);fill:#FF4D64}

.chip{display:inline-flex;align-items:center;min-height:2.4rem;padding:.3rem .9rem;border-radius:999px;border:2px dashed var(--line);font-family:var(--display);font-weight:700;color:var(--soft)}
.chip.on{border-style:solid;border-color:var(--mint);color:var(--mint);background:rgba(59,224,161,.12)}
.part:disabled{opacity:.4;cursor:default;transform:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bb-hole{fill:#3A3F55}
.bb-lbl{font:800 13px var(--display);fill:#8A90AE;text-anchor:middle;dominant-baseline:central}
.bb-sign{font:800 22px var(--display);text-anchor:middle;dominant-baseline:central}
.bb-mark{fill:none;stroke:#FF9F1C;stroke-width:4}
.bb-mark.pick{stroke:#7B5CFF}
.bb-mark.ok{stroke:#1FBF84;stroke-width:5}
.bb-mark.bad{stroke:#FF4D64;stroke-width:5}
.bb-mark.miss{stroke:#1FBF84;stroke-dasharray:4 4}
.bb-mark.star{stroke:#FF9F1C;stroke-width:5}
.bb-mark.pend{stroke:#FF9F1C;stroke-width:5;animation:pulse 1s ease-in-out infinite}
.bb-leg{fill:none;stroke:#8C93B0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.bb-plus{font:800 16px var(--display);fill:#E0334B;text-anchor:middle;dominant-baseline:central}
.bbpart{cursor:pointer}

@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{50%{opacity:.45}}
@keyframes ringp{50%{stroke-opacity:.25}}
@keyframes flick{50%{opacity:.15}}
@keyframes smoke{from{transform:translateY(0);opacity:.9}to{transform:translateY(-34px);opacity:0}}
@keyframes wave{from{opacity:1}to{opacity:.05}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .volty,.socket,.pad,.wend.idle,.ring,.sparks path,.smoke circle,.waves path{animation:none}
  .flow{animation-duration:3s!important}
  .wincard,.winbolts .bolt.on,.screen,.stage.enter>*{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= storage ================= */
const Store = {
  key: 'circuitQuest.v1',
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  set(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) {} }
};
const getStars = () => Store.get().stars || {};
function saveStars(n, s) { const d = Store.get(); d.stars = d.stars || {}; d.stars[n] = Math.max(d.stars[n] || 0, s); Store.set(d); }

/* ================= sound ================= */
const Snd = {
  ctx: null, muted: !!Store.get().muted,
  ac() {
    if (this.muted) return null;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, { type = 'sine', v = .12, at = 0, to = null } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(d, v = .2) {
    const c = this.ac(); if (!c) return;
    const len = c.sampleRate * d | 0, buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = v; s.connect(g).connect(c.destination); s.start();
  }
};
function sfx(n) {
  switch (n) {
    case 'tap': Snd.tone(660, .08, { type: 'triangle', v: .08 }); break;
    case 'pick': Snd.tone(520, .1, { type: 'triangle', v: .08, to: 780 }); break;
    case 'drop': Snd.tone(320, .12, { type: 'triangle', v: .1, to: 190 }); break;
    case 'click': Snd.tone(1400, .035, { type: 'square', v: .05 }); break;
    case 'good': [523, 659, 784].forEach((f, i) => Snd.tone(f, .18, { type: 'triangle', v: .12, at: i * .09 })); break;
    case 'bad': Snd.tone(220, .28, { type: 'sawtooth', v: .06, to: 140 }); break;
    case 'on': Snd.tone(440, .22, { v: .1, to: 880 }); break;
    case 'pop': Snd.noise(.4, .35); Snd.tone(170, .3, { type: 'square', v: .08, to: 50 }); break;
    case 'zap': Snd.noise(.09, .12); break;
    case 'buzz': for (let i = 0; i < 3; i++) Snd.tone(1150, .18, { type: 'square', v: .04, at: i * .28 }); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => Snd.tone(f, .3, { type: 'triangle', v: .13, at: i * .12 })); Snd.tone(1047, .6, { v: .08, at: .5 }); break;
  }
}

/* ================= confetti ================= */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), c = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FFD23F', '#3BE0A1', '#5CC8FF', '#FF6B7A', '#FFFFFF'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 240, y: H * .4, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 7 + 5, c: cols[Math.random() * 5 | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function f(t) {
    c.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); c.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else c.clearRect(0, 0, W, H);
  })(t0);
}

/* ================= icons & mascot ================= */
const BOLT = on => `<svg viewBox="0 0 24 24" class="bolt${on ? ' on' : ''}" aria-hidden="true"><path d="M13.5 1.5 4 13.5h6.5L9 22.5l10-12.5h-6.6z"/></svg>`;
const SPK_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const FS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FS_EXIT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const fsBtn = () => document.fullscreenEnabled ? `<button class="iconbtn" data-fs aria-label="${document.fullscreenElement ? 'Exit full screen' : 'Full screen'}" title="Full screen">${document.fullscreenElement ? FS_EXIT : FS_ICON}</button>` : '';
const soundBtn = () => `<button class="iconbtn" data-snd aria-label="${Snd.muted ? 'Turn sound on' : 'Turn sound off'}">${Snd.muted ? SPK_OFF : SPK_ON}</button>`;

function volty(mood = 'happy') {
  const mouth = {
    happy: '<path d="M31 51 Q40 60 49 51" stroke="#3a2600" stroke-width="3.5" fill="none" stroke-linecap="round"/>',
    think: '<path d="M34 54 H46" stroke="#3a2600" stroke-width="3.5" stroke-linecap="round"/>',
    oops: '<path d="M30 56 q5 -5 10 0 t10 0" stroke="#3a2600" stroke-width="3.5" fill="none" stroke-linecap="round"/>',
    wow: '<ellipse cx="40" cy="54" rx="6" ry="7" fill="#3a2600"/>'
  }[mood] || '';
  const eyeY = mood === 'think' ? 40 : 43;
  return `<svg class="volty" viewBox="0 0 80 80" aria-hidden="true">
    <path d="M47 1 L29 25 H40 L33 38 L55 13 H43 L50 1 Z" fill="#FFE68A"/>
    <circle cx="40" cy="47" r="27" fill="#FFD23F"/>
    <path d="M18 40 A24 24 0 0 1 40 22" stroke="#FFF1B3" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="31" cy="${eyeY}" rx="4" ry="5.5" fill="#2a1c00"/><ellipse cx="49" cy="${eyeY}" rx="4" ry="5.5" fill="#2a1c00"/>
    <circle cx="32.5" cy="${eyeY - 2}" r="1.5" fill="#fff"/><circle cx="50.5" cy="${eyeY - 2}" r="1.5" fill="#fff"/>
    <circle cx="23" cy="52" r="4.5" fill="#FF9A6B" opacity=".55"/><circle cx="57" cy="52" r="4.5" fill="#FF9A6B" opacity=".55"/>
    ${mouth}</svg>`;
}

/* ================= SVG circuit parts ================= */
const DEFS = `<defs>
 <radialGradient id="gY"><stop offset="0" stop-color="#FFF7CF" stop-opacity=".95"/><stop offset=".35" stop-color="#FFD23F" stop-opacity=".5"/><stop offset="1" stop-color="#FFD23F" stop-opacity="0"/></radialGradient>
 <radialGradient id="gR"><stop offset="0" stop-color="#FFE0E4" stop-opacity=".95"/><stop offset=".35" stop-color="#FF4D64" stop-opacity=".5"/><stop offset="1" stop-color="#FF4D64" stop-opacity="0"/></radialGradient>
 <radialGradient id="gG"><stop offset="0" stop-color="#DDFFF1" stop-opacity=".95"/><stop offset=".35" stop-color="#3BE0A1" stop-opacity=".5"/><stop offset="1" stop-color="#3BE0A1" stop-opacity="0"/></radialGradient>
</defs>`;
const LEDC = {
  red: { on: '#FF4D64', off: 'rgba(255,77,100,.28)', rim: '#B8324A', g: 'gR' },
  green: { on: '#3BE0A1', off: 'rgba(59,224,161,.25)', rim: '#1F9E70', g: 'gG' },
  yellow: { on: '#FFD23F', off: 'rgba(255,210,63,.25)', rim: '#B8921C', g: 'gY' }
};
const cut = (x1, x2, h = 20) => `<rect class="cut" x="${x1}" y="${-h / 2}" width="${x2 - x1}" height="${h}"/>`;
// Content that stays upright however the part is rotated or flipped
const upr = (x, y, inner, s) => `<g transform="translate(${x} ${y}) scale(${s.d || 1} 1) rotate(${-(s.a || 0)})">${inner}</g>`;
const lbl = (x, y, t, cls, s) => upr(x, y, `<text class="${cls}" text-anchor="middle" dominant-baseline="central">${t}</text>`, s);
const SMOKE = '<g class="smoke"><circle cx="-6" cy="-70" r="9"/><circle cx="8" cy="-78" r="12"/><circle cx="-2" cy="-90" r="14"/></g>';
const SPARKS = '<g class="sparks"><path d="M-22 -8 l-6 -14 l9 3 l-5 -15"/><path d="M8 -8 l6 -13 l-9 1 l7 -15"/><path d="M-6 8 l-5 13 l9 -3 l-4 13"/></g>';
const wirePath = d => `<path class="w-out" d="${d}"/><path class="w-in" d="${d}"/>`;

const PART = {
  wire: () => '',
  battery(p, s) {
    const v = p.volts || ({ 1: '3V', 2: '6V', 3: '9V' })[p.level || 1];
    let x = '';
    if (p.conn === 'looseNeg') x = cut(-76, -46) + wirePath('M-76 0 C-62 0 -62 24 -54 30') + '<circle cx="-54" cy="30" r="6" class="tip"/>';
    if (p.conn === 'loosePos') x = cut(46, 76) + wirePath('M76 0 C62 0 62 24 54 30') + '<circle cx="54" cy="30" r="6" class="tip"/>';
    if (p.conn === 'bothPos') x = cut(-76, -46) + wirePath('M-76 0 V44 H64 V6');
    if (p.conn === 'bothNeg') x = cut(46, 76) + wirePath('M76 0 V44 H-64 V6');
    return x + `<rect x="-46" y="-26" width="86" height="52" rx="12" class="bat-body"/>
      <path d="M16 -26 H28 a12 12 0 0 1 12 12 V14 a12 12 0 0 1 -12 12 H16 Z" fill="#FFD23F"/>
      <rect x="40" y="-11" width="8" height="22" rx="3" fill="#FFD23F"/>` +
      lbl(28, 1, '+', 'bt-p', s) + lbl(-33, 1, '−', 'bt-m', s) + lbl(-8, 1, v, 'bt-v', s);
  },
  bulb(p, s) {
    const on = s.on, b = s.bright ?? 1;
    return cut(-20, 20) + (on ? `<circle cx="0" cy="-52" r="${46 + 40 * b}" fill="url(#gY)" opacity="${.3 + .7 * b}"/>` : '') +
      `<rect x="-26" y="-12" width="52" height="22" rx="8" class="holder"/>
       <circle cx="-18" cy="0" r="4" class="joint"/><circle cx="18" cy="0" r="4" class="joint"/>
       <path d="M-13 -12 V-25 H13 V-12 Z" class="screw"/><path d="M-13 -16 H13 M-13 -21 H13" stroke="#8C90AE" stroke-width="1.5"/>
       <path d="M-13 -25 C-13 -33 -28 -38 -28 -54 A28 28 0 1 1 28 -54 C28 -38 13 -33 13 -25 Z" class="glass${on ? ' lit' : ''}"${on ? ` style="fill:rgba(255,236,150,${.35 + .6 * b})"` : ''}/>
       <path d="M-7 -25 L-6 -50 Q0 -60 6 -50 L7 -25" class="fil${on ? ' lit' : ''}"/>`;
  },
  bulbC(p, s) { // centred bulb used in the switch circuits
    const on = s.on, b = s.bright ?? 1;
    return cut(-30, 30) + (on ? `<circle r="${40 + 44 * b}" fill="url(#gY)" opacity="${.25 + .75 * b}"/>` : '') +
      `<circle r="28" class="glass${on ? ' lit' : ''}"${on ? ` style="fill:rgba(255,236,150,${.3 + .65 * b})"` : ''}/>
       <path d="M-30 0 H-13 M30 0 H13" stroke="#8C90AE" stroke-width="4"/>
       <path d="M-13 0 q3 -10 6.5 0 t6.5 0 t6.5 0 t6.5 0" class="fil${on ? ' lit' : ''}"/>`;
  },
  led(p, s) {
    const c = LEDC[p.color || 'red'], burnt = s.burnt, on = s.on && !burnt, b = s.bright ?? 1;
    return cut(-10, 10) + (on ? `<circle cx="0" cy="-44" r="${34 + 50 * b}" fill="url(#${c.g})" opacity="${.2 + .8 * b}"/>` : '') +
      `<path d="M-10 -26 V30 l-6 8" class="leg"/><path d="M10 -26 V13" class="leg"/>
       <circle cx="-10" cy="0" r="5" class="joint"/><circle cx="10" cy="0" r="5" class="joint"/>
       <rect x="-22" y="-32" width="44" height="8" rx="3" fill="${burnt ? '#3a3a48' : c.rim}"/>
       <path d="M-17 -32 V-54 A17 17 0 0 1 17 -54 V-32 Z" fill="${burnt ? '#2f2f3a' : on ? c.on : c.off}" stroke="${burnt ? '#555' : on ? '#fff' : c.rim}" stroke-width="2.5"${on && b < .5 ? ` fill-opacity="${.35 + b}"` : ''}/>
       <path d="M-9 -36 V-53 A9 9 0 0 1 -3 -61" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>` +
      (burnt ? '<path d="M-6 -62 l6 10 l-5 6 l7 9" stroke="#0b0b10" stroke-width="2.5" fill="none"/>' + SMOKE : '');
  },
  buzzer(p, s) {
    const on = s.on;
    return cut(-10, 10) + `<path d="M-10 0 V-22" stroke="#FF4D64" stroke-width="6" stroke-linecap="round"/>
      <path d="M10 0 V-22" stroke="#0b0b10" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-10" cy="0" r="5" class="joint"/><circle cx="10" cy="0" r="5" class="joint"/>
      <circle cx="0" cy="-46" r="27" fill="#1d1d27" stroke="#4a4a5c" stroke-width="3"/><circle cx="0" cy="-46" r="7" fill="#07070b"/>` +
      lbl(-15, -52, '+', 'plus-mark', s) +
      (on ? '<g class="waves"><path d="M-18 -82 q18 -12 36 0"/><path d="M-26 -93 q26 -16 52 0"/><path d="M-34 -104 q34 -20 68 0"/></g>' : '');
  },
  resistor(p, s) {
    const n = p.strength ?? 1; let sh = '';
    for (let i = 0; i < n; i++) sh += `<path transform="translate(${(i - (n - 1) / 2) * 22} 0)" d="M0 -10 L9 -6.5 V1 C9 6.5 4.5 9.5 0 11 C-4.5 9.5 -9 6.5 -9 1 V-6.5 Z" class="shield"/>`;
    return `<rect x="-32" y="-13" width="64" height="26" rx="13" class="res"/>
      <rect x="-19" y="-13" width="6" height="26" fill="#7A4A21"/><rect x="-8" y="-13" width="6" height="26" fill="#1a1a1a"/>
      <rect x="3" y="-13" width="6" height="26" fill="${['#1a1a1a', '#8B4513', '#E0433A', '#F08A24'][n] || '#E0433A'}"/><rect x="14" y="-13" width="5" height="26" fill="#D4AF37"/>` +
      upr(0, -35, sh, s);
  },
  switch(p) {
    return cut(-32, 32) + `<rect x="-44" y="-15" width="88" height="30" rx="15" class="sw-base"/>
      <circle cx="-26" cy="0" r="7" class="joint"/><circle cx="26" cy="0" r="7" class="joint"/>` +
      (p.closed ? '<path d="M-26 0 L26 0" class="lever"/><circle cx="26" cy="0" r="9" class="knob"/>'
                : '<path d="M-26 0 L12 -34" class="lever"/><circle cx="12" cy="-34" r="9" class="knob"/>');
  },
  gap: () => cut(-34, 34) + '<rect x="-34" y="-6" width="10" height="12" rx="3" class="tip"/><rect x="24" y="-6" width="10" height="12" rx="3" class="tip"/>',
  wood: () => cut(-44, 44) + `<rect x="-46" y="-14" width="92" height="28" rx="7" fill="#C98B4E" stroke="#8A5A2B" stroke-width="3"/>
      <path d="M-36 -5 q20 -5 40 0 t30 0 M-38 6 q24 5 46 0 t26 -2" stroke="#8A5A2B" stroke-width="2" fill="none"/>`,
  plastic: () => cut(-44, 44) + `<rect x="-46" y="-12" width="92" height="24" rx="12" fill="#7BD3F7" stroke="#3B9FD0" stroke-width="3"/>
      <path d="M-28 -10 l-8 20 M-10 -10 l-8 20 M8 -10 l-8 20 M26 -10 l-8 20 M40 -8 l-6 16" stroke="#fff" stroke-opacity=".75" stroke-width="6"/>`,
  eraser: () => cut(-42, 42) + `<rect x="-42" y="-14" width="84" height="28" rx="6" fill="#FF9BB3" stroke="#D86B88" stroke-width="3"/>
      <path d="M-4 -14 H36 a6 6 0 0 1 6 6 V8 a6 6 0 0 1 -6 6 H-4 Z" fill="#4E7BFF"/>`,
  patch: () => cut(-46, 46) + `<path d="M-40 0 H40" stroke="#060920" stroke-width="17" stroke-linecap="round"/>
      <path d="M-40 0 H40" stroke="#8C9BFF" stroke-width="10" stroke-linecap="round"/>
      <rect x="-50" y="-11" width="12" height="22" rx="4" fill="#B9BDD8"/><rect x="38" y="-11" width="12" height="22" rx="4" fill="#B9BDD8"/>`,
  bare: (p, s) => cut(-38, 38) + `<rect x="-40" y="-5" width="80" height="10" rx="3" fill="#E4833F"/>
      <path d="M-38 -2 H38 M-38 2 H38" stroke="#F7B27A" stroke-width="1.2"/>

/* ================= loop circuits: geometry, logic, drawing ================= */

function evalBB(parts) {
  const par = {}, f = x => { if (!(x in par)) par[x] = x; while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  parts.forEach(p => { if (p.type === 'wire') { const a = f(netOf(p.a)), b = f(netOf(p.b)); if (a !== b) par[a] = b; } });
  const P = f('tp'), N = f('tn'), out = { status: 'open', lit: new Set(), burnt: new Set(), roots: new Set(), f };
  if (P === N) { out.status = 'short'; return out; }

  let reversed = false, resOnly = false;
  const seen = new Set([P]), path = [];
  (function dfs(n, rev) {
    if (n === N) {
      const leds = path.filter(c => c.type === 'led'), hasR = path.some(c => c.type === 'res');
      if (rev) { reversed = true; return; }
      if (!leds.length) { resOnly = true; return; }
      if (hasR) { leds.forEach(c => out.lit.add(c.i)); path.forEach(c => { out.roots.add(c.na); out.roots.add(c.nb); }); }
      else leds.forEach(c => out.burnt.add(c.i));
      return;
    }
    for (const c of comps) {
      if (path.includes(c) || c.na === c.nb) continue;
      let nx, r = false;
      if (c.na === n) nx = c.nb; else if (c.nb === n) { nx = c.na; r = c.type === 'led'; } else continue;
      if (seen.has(nx)) continue;
      seen.add(nx); path.push(c); dfs(nx, rev || r); path.pop(); seen.delete(nx);
    }
  })(P, false);
  if (out.burnt.size) { out.status = 'burn'; out.lit.clear(); out.roots.clear(); }
  else if (out.lit.size) out.status = 'works';
  else if (comps.some(c => c.type === 'led' && c.na === c.nb)) out.status = 'bypass';
  else if (reversed) out.status = 'reversed';
  else if (resOnly) out.status = 'resonly';

}

    const col = [na, nb].some(n => n === 'tp' || n === 'bp') ? '#FF4D64' : [na, nb].some(n => n === 'tn' || n === 'bn') ? '#2F8FE8' : '#1FBF84';

  }

  const da = `M${ax} ${cy + 15}V${cy + 24}l${sg * 6} 6L${x1} ${y1}`, dk = `M${kx} ${cy + 15}L${x2} ${y2}`;

        <p>${s < 3 ? `You made ${this.mistakes} mistakes. Play again to earn all 3 bolts!` : this.mistakes ? `Only ${this.mistakes} mistake${this.mistakes === 1 ? '' : 's'}: you earned all 3 bolts!` : 'Perfect! No mistakes, and all 3 bolts are yours.'}</p>
        <div class="actions"><button class="btn ghost" data-a="again">Play again</button>${n < LEVELS.length ? `<a class="btn primary" href="#m${n + 1}">Next mission ›</a>` : '<a class="btn primary" href="#map">Back to missions</a>'}</div></div>`;
      document.body.appendChild(ov);
      $('[data-a="again"]', ov).onclick = () => { stopCurrent(); openLevel(n); };
      $('.btn.primary', ov).focus();
    }
  };
  L.play(ctx);
}

function route() {
  stopCurrent();
  const m = /^#m(\d+)$/.exec(location.hash);
  if (m && LEVELS[+m[1] - 1]) openLevel(+m[1]); else showMap();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fs]');
  if (f) { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); return; }
  const b = e.target.closest('[data-snd]'); if (!b) return;
  Snd.muted = !Snd.muted; const d = Store.get(); d.muted = Snd.muted; Store.set(d);
  b.outerHTML = soundBtn(); if (!Snd.muted) sfx('tap');
});
window.addEventListener('hashchange', route);
document.addEventListener('fullscreenchange', () => $$('[data-fs]').forEach(b => { b.outerHTML = fsBtn(); }));
route();
})();
</script>
</body>
</html>
