<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Circuit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0A0F2E; --ink2:#0F1540; --stage:#121A4B; --panel:#18215C; --panel2:#212B74; --line:#2E3A92;
  --text:#F4F5FF; --soft:#B3BAEC; --dim:#737CBE;
  --volt:#FFD23F; --mint:#3BE0A1; --coral:#FF6B7A; --sky:#5CC8FF; --copper:#E4833F; --wire:#6477FF;
  --display:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(14px, calc(.55vw + .85vh), 26px)}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);font-family:var(--body);font-size:1rem;line-height:1.4;
  background-color:var(--ink);
  background-image:
    radial-gradient(900px 520px at 88% -8%, rgba(100,119,255,.24), transparent 62%),
    radial-gradient(760px 520px at -12% 108%, rgba(59,224,161,.10), transparent 60%),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit}
.screen{height:100vh;height:100dvh;max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(6px,1.3vh,16px);padding-inline:clamp(14px,2.2vw,32px);padding-block:clamp(8px,1.8vh,20px);animation:fadein .35s ease both}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-family:var(--display);font-weight:800;font-size:1.15rem;
  border:0;border-radius:999px;padding:.45em 1.3em;min-height:3.1rem;white-space:nowrap;cursor:pointer;text-decoration:none;
  background:var(--panel2);color:var(--text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);transition:transform .12s ease, filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--volt);color:#211a00}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:1rem;min-height:2.7rem;padding:.3em 1em}
.iconbtn{flex:none;width:2.9rem;height:2.9rem;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:1.45rem;height:1.45rem;fill:currentColor}
.iconbtn:hover{border-color:var(--soft)}

/* ---------- map ---------- */
.maphead{display:flex;align-items:center;gap:.7rem}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.logo svg{width:1.7rem;height:1.7rem;fill:var(--volt);filter:drop-shadow(0 0 8px rgba(255,210,63,.6))}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(12px,2.6vw,44px);align-items:center}
.kicker{margin:0 0 .3rem;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,min(9vh,6.5vw),5.4rem);line-height:.95;margin:0;letter-spacing:-.01em}
.brand .q{color:var(--volt);text-shadow:0 0 28px rgba(255,210,63,.5)}
.lede{color:var(--soft);font-size:1.05rem;max-width:46ch;margin:.5em 0 .9em;font-weight:700}
.cta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.tip{color:var(--dim);font-weight:700;font-size:.8rem;margin:0;max-width:30ch}
.tip code{color:var(--soft);background:var(--panel);padding:1px 5px;border-radius:5px}
.labcell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:1.6rem;padding:clamp(10px,1.8vh,20px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px)}
.lc-top{display:flex;gap:.8rem;align-items:center}
.lc-top .volty{width:4rem;height:4rem;flex:none}
.lc-top p{margin:0;font-weight:700;color:var(--soft)}
.lc-top b{color:var(--text)}
.bigcell{display:flex;align-items:center}
.bc-body{flex:1;height:3rem;border:4px solid var(--soft);border-radius:14px;padding:4px;position:relative;overflow:hidden;background:var(--ink2)}
.bc-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),var(--volt));box-shadow:0 0 22px rgba(255,210,63,.45);min-width:6px;transition:width .8s ease}
.bc-ticks{position:absolute;inset:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 11 - 3px),var(--ink2) calc(100% / 11 - 3px) calc(100% / 11))}
.bc-nub{width:10px;height:1.5rem;background:var(--soft);border-radius:0 6px 6px 0}
.bc-cap{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;color:var(--soft);font-size:.9rem}
.bc-cap b{color:var(--volt);font-family:var(--display);font-size:1.25rem}
.missions{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,16px)}
.mcard{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.35rem;padding:clamp(10px,1.7vh,18px);border-radius:1.4rem;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--line);text-decoration:none;transition:transform .15s ease,border-color .15s}
.mcard:hover{transform:translateY(-4px);border-color:var(--volt)}
.mcard.next{border-color:var(--volt);box-shadow:0 0 0 3px rgba(255,210,63,.18),0 0 30px rgba(255,210,63,.12)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.mnum{font-family:var(--display);font-weight:800;font-size:1.15rem;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;background:var(--ink2);border:2px solid var(--line);flex:none}
.mcard.done .mnum{background:var(--volt);color:#211a00;border-color:var(--volt);box-shadow:0 0 18px rgba(255,210,63,.5)}
.diff{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.dbat{display:inline-flex;gap:2px;padding:2px;border:2px solid var(--soft);border-radius:5px;position:relative;margin-right:4px}
.dbat::after{content:"";position:absolute;right:-6px;top:50%;width:3px;height:7px;transform:translateY(-50%);background:var(--soft);border-radius:0 2px 2px 0}
.dbat i{width:5px;height:11px;border-radius:1px;background:rgba(255,255,255,.1)}
.dbat i.on{background:var(--dc)}
.mname{font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,2.9vh,1.45rem);line-height:1.05;margin:.2rem 0 0}
.mdesc{color:var(--soft);margin:0;font-size:.88rem;font-weight:700;flex:1;min-height:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mfoot{display:flex;justify-content:space-between;align-items:center}
.bolts{display:flex;gap:2px}
.bolt{width:1.35rem;height:1.35rem;fill:rgba(255,255,255,.14)}
.bolt.on{fill:var(--volt);filter:drop-shadow(0 0 5px rgba(255,210,63,.6))}
.play{font-family:var(--display);font-weight:800;color:var(--volt);font-size:1rem}

/* ---------- level: header · goal · stage · dock ---------- */
.lvhead{display:flex;align-items:center;gap:.8rem;flex:none}
.lvtitle{flex:1;min-width:0}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.lvtitle h1{font-family:var(--display);font-size:clamp(1.3rem,4.2vh,2.3rem);margin:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:40vw}
.dots i{width:.85rem;height:.85rem;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.dots i.done{background:var(--mint);border-color:var(--mint)}
.dots i.now{background:var(--volt);border-color:var(--volt);box-shadow:0 0 10px rgba(255,210,63,.7)}
.goal{flex:none;min-height:2.5em;display:flex;flex-direction:column;justify-content:center;font-family:var(--display);font-size:clamp(1rem,3vh,1.5rem);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.goal b{color:var(--volt)}
.goal-s{display:block;font-family:var(--body);font-size:.85rem;color:var(--soft);font-weight:700;margin-top:2px}
.stagebox{flex:1;min-height:0;display:flex;gap:clamp(8px,1.4vw,18px)}
.stagecell{flex:1;min-width:0;container-type:size;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center}
.stage{width:min(100%, calc((100vh - 17rem) * 1000 / 560));width:min(100cqw, calc(100cqh * 1000 / 560));aspect-ratio:1000/560;
  background:var(--stage);border:3px solid var(--line);border-radius:clamp(14px,2vh,26px);overflow:hidden;position:relative;
  box-shadow:0 22px 50px rgba(0,0,0,.35);transition:border-color .25s}
.stage.good{border-color:var(--mint)} .stage.bad{border-color:var(--coral)} .stage.warn{border-color:var(--volt)}
.stage.bare{width:100%;height:100%;min-height:0;aspect-ratio:auto;background:none;border:0;box-shadow:none;overflow:visible;border-radius:0}
.stage.enter>*{animation:fadein .3s ease both}
svg.board{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stage>svg.board{height:100%}
svg.board.drag{touch-action:none}
.dock{flex:none;height:clamp(6.6rem,18vh,8.4rem);display:flex;align-items:stretch;gap:clamp(8px,1.2vw,16px)}
.talk{flex:1 1 16rem;min-width:13rem;display:flex;gap:.7rem;align-items:center}
.talk .volty{flex:none;width:3.6rem;height:3.6rem}
#vbox{flex:none;display:flex}
.bubble{position:relative;flex:1;max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:1.1rem;padding:.55rem .9rem;
  font-size:1.1rem;font-weight:700;line-height:1.3;min-height:3.2rem;display:flex;align-items:center;transition:border-color .2s}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--panel);border-left:2px solid;border-bottom:2px solid;border-color:inherit;transform:translateY(-50%) rotate(45deg)}
.bubble.good{border-color:var(--mint)} .bubble.bad{border-color:var(--coral)} .bubble.warn{border-color:var(--volt)}
.tray{flex:0 1 auto;min-width:0;display:flex;gap:.55rem;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:3px}
.tray:empty,.actions:empty{display:none}
.tray:has(.chip){flex-wrap:wrap;align-content:center;max-width:34rem}
.part{touch-action:none;flex:none;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.35rem .35rem .4rem;border-radius:1rem;border:3px solid var(--line);
  background:var(--panel);color:var(--text);cursor:grab;transition:transform .12s,border-color .12s;width:6.8rem}
.part:hover{transform:translateY(-2px);border-color:var(--soft)}
.part.sel{border-color:var(--volt);box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.part.lifted{opacity:.3}
.part .icon{display:block;width:100%;flex:1;min-height:0;overflow:hidden;background:var(--stage);border-radius:.7rem}
.part .icon svg{width:100%;height:100%;display:block}
.pname{font-family:var(--display);font-weight:800;font-size:.85rem;line-height:1.05;text-align:center}
.pname small{display:block;font-family:var(--body);font-size:.68rem;color:var(--soft);font-weight:700;margin-top:1px}
.part.tool{width:9rem}
.drag-ghost{position:fixed;left:0;top:0;margin:0;z-index:50;pointer-events:none;transform:scale(1.06) rotate(-3deg);filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));opacity:.95}
.actions{flex:none;display:flex;flex-direction:column;gap:.5rem;justify-content:center;min-width:10rem}
.traynote{color:var(--soft);font-weight:700;margin:0;align-self:center;max-width:14rem}

/* mission 1 cards */
.cards{height:100%;display:grid;gap:clamp(8px,1.4vh,16px);grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.cards.six{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.ccard{position:relative;min-height:0;display:flex;flex-direction:column;gap:2px;padding:6px 6px 8px;background:var(--stage);border:3px solid var(--line);border-radius:1.3rem;color:var(--text);cursor:pointer;text-align:center;transition:transform .12s,border-color .15s}
.ccard svg.board{flex:1;min-height:0;height:100%}
.ccard:hover:not(:disabled){transform:translateY(-3px)}
.ccard:disabled{cursor:default}
.ccard.picked{border-color:var(--volt);box-shadow:0 0 0 4px rgba(255,210,63,.18)}
.ccard.right{border-color:var(--mint)} .ccard.wrong{border-color:var(--coral)} .ccard.missed{border-color:var(--volt);border-style:dashed}
.cnum{position:absolute;left:10px;top:8px;font-family:var(--display);font-weight:800;width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--panel2);font-size:1rem}
.ccard.picked .cnum{background:var(--volt);color:#211a00}
.cap{flex:none;font-weight:800;font-size:.88rem;line-height:1.2;min-height:2.4em;padding:0 8px;color:var(--soft)}
.ccard.right .cap b{color:var(--mint)} .ccard.wrong .cap b{color:var(--coral)} .ccard.missed .cap b{color:var(--volt)}

/* mission 2 */
.det{height:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:clamp(10px,1.6vw,20px);align-items:stretch}
.det-mid{min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px)}
.bin{min-height:0;border-radius:1.6rem;border:3px dashed;display:flex;flex-direction:column;align-items:center;gap:4px;padding:1rem .8rem;color:var(--text);cursor:pointer;transition:transform .15s, background .15s}
.bin.cond{border-color:var(--mint);background:rgba(59,224,161,.07)}
.bin.ins{border-color:var(--coral);background:rgba(255,107,122,.07)}
.bin.over,.bin:hover{transform:scale(1.02)}
.bin.cond.over{background:rgba(59,224,161,.18)} .bin.ins.over{background:rgba(255,107,122,.18)}
.bin-h{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4vh,2rem);line-height:1.1}
.bin.cond .bin-h{color:var(--mint)} .bin.ins .bin-h{color:var(--coral)}
.bin-s{color:var(--soft);font-weight:800;font-size:.95rem}
.bin-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-end;font-size:clamp(1.5rem,4.5vh,2.4rem);margin-top:auto;padding-top:.6rem}
.tester{flex:1;min-height:0;width:100%;background:var(--stage);border:3px solid var(--line);border-radius:1.3rem;overflow:hidden;transition:border-color .15s}
.tester svg.board{height:100%}
.tester.over{border-color:var(--volt)}
.token{flex:none;touch-action:none;cursor:grab;background:var(--panel2);border:3px solid var(--volt);border-radius:1.4rem;padding:.3rem 1.6rem .5rem;display:flex;flex-direction:column;align-items:center;color:var(--text);box-shadow:0 12px 26px rgba(0,0,0,.35);min-width:11rem}
.token .te{font-size:clamp(2.4rem,8vh,4.2rem);line-height:1.15}
.token .tn{font-family:var(--display);font-weight:800;font-size:1.15rem}
.token.shake{animation:shake .45s}
.token.lifted{opacity:.3}

/* mission 9 */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:.4rem;width:min(46rem,58vw);height:100%}
.opt{min-height:0;border-radius:.9rem;border:2px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--display);font-weight:700;font-size:.9rem;line-height:1.1;cursor:pointer;padding:.25rem .6rem;text-align:left;transition:border-color .15s, transform .12s}
.opt:hover:not(:disabled){border-color:var(--volt);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--coral);opacity:.55;text-decoration:line-through}
.opt.right{border-color:var(--mint);background:rgba(59,224,161,.15)}

/* small screens: fall back to a scrolling page */
@media (max-width:700px){
  body{overflow:auto}
  .screen{height:auto;min-height:100dvh}
  .hero{grid-template-columns:1fr}
  .missions{flex:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .stagebox{flex:none;flex-direction:column}
  .stagecell{flex:none;container-type:normal;display:block}
  .ideas{width:auto}
  .topics{flex:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .finals{grid-template-columns:1fr}
  .stage{width:100%}
  .stage.bare{height:auto}
  .cards,.cards.six{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .det{height:auto;grid-template-columns:1fr 1fr}
  .det-mid{grid-column:1/-1;order:-1}
  .bin{min-height:9rem}
  .tester{flex:none}
  .dock{height:auto;flex-wrap:wrap}
  .tray{flex-wrap:wrap;overflow:visible;justify-content:center;width:100%}
  .part .icon{flex:none;height:4.5rem}
  .actions{flex-direction:row;width:100%;flex-wrap:wrap}
  .opts{width:100%;grid-template-columns:1fr 1fr}
  .opt{min-height:2.8rem}
  .dots{max-width:none}
}

/* win overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,9,30,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.wincard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--volt);border-radius:30px;padding:26px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 60px rgba(255,210,63,.25);animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.wincard .volty{width:96px;height:96px}
.wincard h2{font-family:var(--display);font-size:2.2rem;margin:4px 0 6px;line-height:1}
.wincard p{color:var(--soft);font-weight:700;margin:10px 0 0}
.winbolts{display:flex;justify-content:center;gap:8px}
.winbolts .bolt{width:52px;height:52px}
.winbolts .bolt.on{animation:popin .5s both}
.winbolts .bolt:nth-child(2){animation-delay:.15s}.winbolts .bolt:nth-child(3){animation-delay:.3s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* mascot */
.volty{animation:bob 3.2s ease-in-out infinite}

/* ---------- SVG parts ---------- */
.w-out{fill:none;stroke:#060920;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.w-in{fill:none;stroke:var(--wire);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.w-red{fill:none;stroke:#FF4D64;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.w-blue{fill:none;stroke:#3FA9FF;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#FFF0A8;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 23;animation:flow .8s linear infinite}
.flow.rev{animation-direction:reverse}
.cut{fill:var(--stage)}
.joint{fill:#D5D9F2}
.leg{fill:none;stroke:#D5D9F2;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.leg.big{stroke-width:9}
.holder{fill:#394282;stroke:#5463C4;stroke-width:2}
.screw{fill:#B9BDD8}
.glass{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.55);stroke-width:2.5}
.glass.lit{stroke:#fff}
.fil{fill:none;stroke:#7D82A8;stroke-width:2.5;stroke-linejoin:round}
.fil.lit{stroke:#fff}
.bat-body{fill:#262F78;stroke:#4B58BD;stroke-width:3}
.bt-p{font:800 26px var(--display);fill:#2a2000}
.bt-m{font:800 30px var(--display);fill:var(--sky)}
.bt-v{font:800 17px var(--display);fill:#fff}
.res{fill:#EAD3A8;stroke:#B8976A;stroke-width:2.5}
.shield{fill:var(--mint);stroke:#0d5a3f;stroke-width:1.5}
.sw-base{fill:#232B6E;stroke:#3F4AA6;stroke-width:2}
.lever{stroke:#E8EBFF;stroke-width:7;stroke-linecap:round}
.knob{fill:var(--coral)}
.tip{fill:var(--copper)}
.socket{fill:rgba(255,210,63,.06);stroke:var(--volt);stroke-width:3;stroke-dasharray:8 7;animation:pulse 1.6s ease-in-out infinite}
.socket-q{font:800 28px var(--display);fill:var(--volt)}
.socket-q.sm{font-size:17px}
.probe-e{font-size:40px}
.hit{fill:transparent;transition:fill .15s}
.slot.tap{cursor:pointer}

<script>
(() => {
'use strict';
/* Circuit Quest — Session 2 · Electricity (grades 4–5)

   HOW THIS FILE IS ORGANISED
     Part 1  Core: helpers, storage, sound, confetti, mascot
     Part 2  Drawing kit: circuit parts, loop circuits, breadboard
     Part 3  Interaction kit: drag-or-tap, the wire bench
     Part 4  Topics 1–8, each with its LEARN lab, then its SOLVE mission
     Part 5  Final challenges
     Part 6  Course map, screens and router
*/

/* ═════════════════════════════════════════════════════════════════════
   PART 1 · CORE
   ═════════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= storage ================= */
const Store = {
  key: 'circuitQuest.v2',
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },

const getLearned = () => Store.get().learned || {};
function setLearned(n) { const d = Store.get(); d.learned = d.learned || {}; d.learned[n] = true; Store.set(d); }

/* ================= sound ================= */
const Snd = {
  ctx: null, muted: !!Store.get().muted,
  ac() {
    if (this.muted) return null;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, { type = 'sine', v = .12, at = 0, to = null } = {}) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(d, v = .2) {
    const c = this.ac(); if (!c) return;
    const len = c.sampleRate * d | 0, buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = v; s.connect(g).connect(c.destination); s.start();
  }
};
function sfx(n) {
  switch (n) {
    case 'tap': Snd.tone(660, .08, { type: 'triangle', v: .08 }); break;
    case 'pick': Snd.tone(520, .1, { type: 'triangle', v: .08, to: 780 }); break;
    case 'drop': Snd.tone(320, .12, { type: 'triangle', v: .1, to: 190 }); break;
    case 'click': Snd.tone(1400, .035, { type: 'square', v: .05 }); break;
    case 'good': [523, 659, 784].forEach((f, i) => Snd.tone(f, .18, { type: 'triangle', v: .12, at: i * .09 })); break;
    case 'bad': Snd.tone(220, .28, { type: 'sawtooth', v: .06, to: 140 }); break;
    case 'on': Snd.tone(440, .22, { v: .1, to: 880 }); break;
    case 'pop': Snd.noise(.4, .35); Snd.tone(170, .3, { type: 'square', v: .08, to: 50 }); break;
    case 'zap': Snd.noise(.09, .12); break;
    case 'buzz': for (let i = 0; i < 3; i++) Snd.tone(1150, .18, { type: 'square', v: .04, at: i * .28 }); break;
    case 'motor': Snd.tone(70, .9, { type: 'sawtooth', v: .05, to: 90 }); break;
    case 'idea': Snd.tone(988, .12, { type: 'triangle', v: .07 }); Snd.tone(1319, .18, { type: 'triangle', v: .07, at: .09 }); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => Snd.tone(f, .3, { type: 'triangle', v: .13, at: i * .12 })); Snd.tone(1047, .6, { v: .08, at: .5 }); break;
  }
}

/* ================= confetti ================= */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), c = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FFD23F', '#3BE0A1', '#5CC8FF', '#FF6B7A', '#FFFFFF'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 240, y: H * .4, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 7 + 5, c: cols[Math.random() * 5 | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function f(t) {
    c.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); c.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else c.clearRect(0, 0, W, H);
  })(t0);
}

const SPK_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const FS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ═════════════════════════════════════════════════════════════════════
   PART 2 · DRAWING KIT
   ═════════════════════════════════════════════════════════════════════ */
/* ================= SVG circuit parts ================= */

const SPARKS = '<g class="sparks"><path d="M-22 -8 l-6 -14 l9 3 l-5 -15"/><path d="M8 -8 l6 -13 l-9 1 l7 -15"/><path d="M-6 8 l-5 13 l9 -3 l-4 13"/></g>';

const PART = {
  wire: () => '',
  battery(p, s) {

function bbPartSVG(p, i, st) {

  }
  const c = LEDC[p.color || 'red'], cy = Math.min(y1, y2) - 44, sg = x1 <= x2 ? -1 : 1, ax = mx + sg * 7, kx = mx - sg * 7;

/* ================= drag or tap for tray items ================= */
function pickTarget(list, x, y) {
  let best = null, bd = Infinity;
  for (const t of list) {
    const r = t.getBoundingClientRect(), pad = 18;
    if (x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) continue;
    const d = Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2);
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}
function enableDrag(el, o) {
  let st = null;
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    Snd.ac();
    st = { x: e.clientX, y: e.clientY, id: e.pointerId, ghost: null, over: null };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.ghost) {
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 8) return;
      const r = el.getBoundingClientRect(), gh = el.cloneNode(true);
      gh.classList.add('drag-ghost'); gh.classList.remove('sel');
      gh.style.width = r.width + 'px'; gh.style.height = r.height + 'px';
      st.ox = st.x - r.left; st.oy = st.y - r.top; document.body.appendChild(gh); st.ghost = gh;
      el.classList.add('lifted'); sfx('pick');
    }
    st.ghost.style.left = (e.clientX - st.ox) + 'px'; st.ghost.style.top = (e.clientY - st.oy) + 'px';
    const t = pickTarget(o.targets(), e.clientX, e.clientY);
    if (t !== st.over) { st.over && st.over.classList.remove('over'); st.over = t; t && t.classList.add('over'); }
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (!s.ghost) return;
    s.ghost.remove(); el.classList.remove('lifted'); s.over && s.over.classList.remove('over');
    el._dragged = true; setTimeout(() => { el._dragged = false; }, 0);
    if (s.over && e.type === 'pointerup') o.onDrop(s.over);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', () => { if (!el._dragged && o.onTap) o.onTap(); });
}

/* ── Wire bench ───────────────────────────────────────────────────────
   A battery (with an optional resistor on the red wire) and two floppy
   wires. The player drags each wire end onto one of the component's
   terminals. Used by Learn 1, Learn 8 and Solve 8.
     o.terms()        → { id: [x, y] } free spots a wire end can snap to
     o.comp(W, on)    → SVG for the component, drawn under the wires
     o.flowing(W)     → true when electricity runs round the loop
     o.onChange(W,on) → called after every drop
     o.onGrab(k)      → called when a wire end is picked up (optional)
     o.locked()       → true to stop dragging (optional)            */
function wireBench(ctx, o) {
  const HOME = { red: [520, 215], blue: [520, 395] };
  const W = { red: { ax: 470, ay: 150 }, blue: { ax: 470, ay: 440 } };
  const home = k => { W[k].x = HOME[k][0]; W[k].y = HOME[k][1]; W[k].at = null; };
  home('red'); home('blue');
  const fl = w => `M${w.ax} ${w.ay}C${w.ax + 110} ${w.ay} ${w.x - 110} ${w.y + 30} ${w.x} ${w.y}`;
  const tail = w => fl(w).replace(/^M\S+ \S+/, '');
  let drag = null;
  function draw() {
    const T = o.terms(), on = o.flowing(W);
    let s = `<svg class="board drag" viewBox="0 0 1000 560" role="img" aria-label="${o.label || 'Battery with two wires'}">${DEFS}`;
    s += '<path class="w-out" d="M150 228V150H470"/><path class="w-red" d="M150 228V150H470"/><path class="w-out" d="M150 369V440H470"/><path class="w-blue" d="M150 369V440H470"/>';
    s += o.comp(W, on);
    for (const k in T) if (W.red.at !== k && W.blue.at !== k) s += `<circle class="pad" cx="${T[k][0]}" cy="${T[k][1]}" r="26"/>`;
    for (const k of ['red', 'blue']) s += `<path data-w="${k}" class="w-out" d="${fl(W[k])}"/><path data-w="${k}" class="w-${k}" d="${fl(W[k])}"/>`;
    if (on) s += `<path class="flow" d="M150 228V150H470${tail(W.red)}"/><path class="flow rev" d="M150 369V440H470${tail(W.blue)}"/>`;
    if (o.resistor) s += `<g transform="translate(310 150) scale(1.25)">${PART.resistor({ strength: 1 }, { a: 0, d: 1 })}</g>`;
    s += `<g transform="translate(150 300) rotate(270) scale(1.5)">${PART.battery({ level: 1 }, { a: 270, d: 1 })}</g>`;
    for (const k of ['red', 'blue']) s += `<circle data-e="${k}" class="wend ${k}${W[k].at ? '' : ' idle'}" cx="${W[k].x}" cy="${W[k].y}" r="22"/>`;
    ctx.stage.innerHTML = s + '</svg>';
    bind();
    return on;
  }
  function bind() {
    const svg = $('svg', ctx.stage);
    svg.addEventListener('pointerdown', e => {
      if (o.locked && o.locked()) return;
      Snd.ac();
      const p = svgPt(svg, e); let best = null, bd = 60;
      for (const k of ['red', 'blue']) { const d = Math.hypot(W[k].x - p.x, W[k].y - p.y); if (d < bd) { bd = d; best = k; } }
      if (!best) return;
      e.preventDefault(); drag = best; W[best].at = null; sfx('pick');
      if (o.onGrab) o.onGrab(best);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    });
    svg.addEventListener('pointermove', e => {
      if (!drag) return;
      const p = svgPt(svg, e), w = W[drag];
      w.x = Math.max(24, Math.min(976, p.x)); w.y = Math.max(24, Math.min(536, p.y));
      $$(`path[data-w="${drag}"]`, svg).forEach(el => el.setAttribute('d', fl(w)));
      const end = $(`circle[data-e="${drag}"]`, svg); end.setAttribute('cx', w.x); end.setAttribute('cy', w.y);
    });
    const up = () => {
      if (!drag) return;
      const w = W[drag], T = o.terms(); drag = null; let snapped = null;
      for (const t in T) {
        if (W.red.at === t || W.blue.at === t) continue;
        if (Math.hypot(T[t][0] - w.x, T[t][1] - w.y) < 64) { snapped = t; break; }
      }
      if (snapped) { w.at = snapped; w.x = T[snapped][0]; w.y = T[snapped][1]; sfx('drop'); } else { w.x = HOME[w === W.red ? 'red' : 'blue'][0]; w.y = HOME[w === W.red ? 'red' : 'blue'][1]; }
      const on = draw();
      o.onChange(W, on);
    };

}

const MINI = { vb: '22 4 356 326', box: { x0: 60, y0: 95, x1: 340, y1: 295 } };
const BULB_T = () => ({ type: 'bulb', edge: 'T', f: .5 });

function solveLoop(ctx) {

      'Look for anything that could block the road.', 'Expert round! Some of these are sneaky: check every part.', 'Master round! Count every switch and check every material.'][r], 'think');

/* ── TOPIC 3 · SOLVE — Wire Repair Shop ──────────────────────────── */
function solveWire(ctx) {
  const SEG = [['T', .22], ['T', .5], ['T', .78], ['B', .22], ['B', .5], ['B', .78]];
  const R = [{ 1: 'bare' }, { 0: 'gap', 4: 'bare' }, { 2: 'wood', 3: 'bare', 5: 'gap', 0: 'bare' }, { 0: 'bare', 1: 'plastic', 2: 'gap', 3: 'wood', 5: 'bare' }, { 0: 'plastic', 1: 'bare', 2: 'wood', 3: 'gap', 4: 'bare', 5: 'plastic' }];
  const GOALS = [
    'A wire lost its plastic cover! Make the circuit <b>work</b> and <b>safe to touch</b>.',
    'Two problems this time. Find them both!',
    'Big repair job! Find and fix <b>every</b> problem.',
    'Expert repair: five problems, and one is a material you haven’t fixed yet!',
    'Master repair: <b>every</b> piece of wire is damaged. Use the right tool for each one!'
  ];
  const TOOLS = [{ id: 'tape', name: 'Insulating tape', sub: 'covers bare copper' }, { id: 'patch', name: 'New wire', sub: 'copper inside, plastic outside' }];
  const BOX = { x0: 150, y0: 120, x1: 830, y1: 440 };
  let r = 0, slots, sel = null, done = false;
  ctx.tray.innerHTML = TOOLS.map(t => `<button class="part tool" data-t="${t.id}"><span class="icon">${toolIcon(t.id)}</span><span class="pname">${t.name}<small>${t.sub}</small></span></button>`).join('');
  const clearSel = () => { sel = null; $$('.tool', ctx.tray).forEach(x => x.classList.remove('sel')); };
  $$('.tool', ctx.tray).forEach(b => enableDrag(b, {
    targets: () => $$('.slot .hit', ctx.stage),
    onDrop: h => apply(b.dataset.t, +h.closest('.slot').dataset.i),
    onTap: () => {
      sel = sel === b.dataset.t ? null : b.dataset.t;
      $$('.tool', ctx.tray).forEach(x => x.classList.toggle('sel', x.dataset.t === sel));
      if (sel) ctx.say('Now tap the part of the wire you want to fix.', 'think');
    }
  }));
  ctx.stage.onclick = e => {
    const g = e.target.closest('.slot'); if (!g) return;
    if (sel) apply(sel, +g.dataset.i);
    else ctx.say('First choose a tool: drag it onto the wire, or tap it and then tap the wire.', 'think');
  };
  function start() {
    done = false; clearSel();
    const d = R[r];
    slots = [BAT(), { type: 'bulb', edge: 'R', f: .5 }, ...SEG.map(([e, f], k) => ({ type: d[k] || 'wire', edge: e, f, seg: true }))];
    ctx.dots(r); ctx.goal(GOALS[r]); ctx.actions([]); ctx.mood('');
    draw(); status(true);
  }
  function draw(hl = -1) { ctx.stage.innerHTML = loopSVG({ box: BOX, slots, powered: true, tap: true, hl }); }
  function status(first) {
    const res = evalLoop(slots), bare = slots.some(p => p.type === 'bare');
    if (res.status !== 'works') {
      ctx.mood('warn');
      ctx.say(first ? 'The bulb is dark. Something is blocking the road for electricity. Can you find it?' : 'Still dark. Electricity needs a complete road made of conductors.', 'think', 'warn');
    } else if (bare) {
      ctx.mood('bad'); sfx('zap');
      ctx.say('The bulb is on, but bare copper is sparking! That is dangerous to touch. Cover it up.', 'oops', 'bad');
    } else {
      done = true; ctx.mood('good'); sfx('good');
      ctx.say(r < R.length - 1 ? 'Fixed! The circuit works and is safe to touch.' : 'All repairs done! Conductor inside, insulator outside: a perfect wire.', 'wow', 'good');
      ctx.actions([{ label: r < R.length - 1 ? 'Next repair ›' : 'Finish mission', cls: 'primary', on: () => { if (r < R.length - 1) { r++; start(); } else ctx.win(); } }]);
    }
  }
  function apply(tool, i) {
    if (done) return;
    const p = slots[i];
    if (!p.seg) { ctx.say('Use your tools on the wires, not on the battery or the bulb.', 'think'); return; }

      else if (p.type === 'gap') msg = 'Tape is plastic, which is an insulator! Electricity can’t cross the gap on tape. Try a new wire.';
      else if (p.type === 'wood' || p.type === 'plastic') msg = 'Tape won’t help here. That piece blocks electricity, so replace it with a new wire.';
      else msg = 'This part of the wire is already fine!';
    } else {
      if (['gap', 'wood', 'plastic'].includes(p.type)) { p.type = 'patch'; ok = true; }
      else if (p.type === 'bare') msg = 'This copper already carries electricity. The problem is that it has no cover. Use tape!';
      else msg = 'This part of the wire is already fine!';
    }
    clearSel();
    if (ok) { sfx('drop'); draw(); status(); }
    else { ctx.miss(); sfx('bad'); draw(i); ctx.mood('bad'); ctx.say(msg, 'oops', 'bad'); }
  }

}

/* ── TOPIC 4 · LEARN — The Dangerous Battery ─────────────────────── */
function learnDanger(ctx) {
  const BOX = { x0: 160, y0: 140, x1: 840, y1: 430 };
  const BATS = [{ v: '3V', k: 'ok', name: '3 V battery' }, { v: '9V', k: 'burn', name: '9 V battery' }, { v: '10,000V', k: 'boom', name: '10,000 V!' }];

  ctx.ideas([
    'The <b>right</b> battery lights the bulb safely.',
    '<b>Too much</b> power burns parts out.',
    '<b>Huge</b> power, like 10,000 V, destroys parts and is dangerous for people too!',
    'So we must <b>protect</b> our circuit. That is the resistor’s job!'
  ]);
  ctx.goal('This bulb is made for a <b>3 V</b> battery. Choose a battery, then tap the <b>switch</b> to close it.');
  ctx.say('Pick a battery from the box and close the switch. What do you think will happen?', 'think');
  function draw(flash) {
    const burnt = state === 'burn' || state === 'boom';
    const slots = [BAT({ volts: bat.v, danger: bat.k === 'boom' }), { type: 'bulb', edge: 'R', f: .5, burnt }, { type: 'switch', edge: 'B', f: .5, closed }];

  }
  function toggle() {
    if (state === 'burn' || state === 'boom') { ctx.say('The bulb is broken. Press <b>New bulb</b> to replace it.', 'think'); return; }

    if (!closed) { state = 'idle'; ctx.mood(''); draw(); ctx.say('Switch open: the loop is broken, so the bulb is off.', 'think'); return; }

    draw(true);
    ctx.later(() => {
      if (bat.k === 'burn') {
        state = 'burn'; sfx('pop'); ctx.learn(1); ctx.mood('bad');
        ctx.say('Flash… POP! 9 V is <b>too much</b> for a 3 V bulb. The thin wire inside melted and the bulb burned out.', 'oops', 'bad');
      } else {
        state = 'boom'; sfx('pop'); ctx.later(() => sfx('pop'), 150); ctx.learn(2); ctx.mood('bad');
        ctx.stage.classList.remove('shake'); void ctx.stage.offsetWidth; ctx.stage.classList.add('shake');
        ctx.say('BOOM! 10,000 volts destroyed the bulb instantly. <b>Never</b> touch wall sockets or big batteries: high voltage is dangerous for people too!', 'oops', 'bad');
      }

    }, 450);
  }

function gauge(v) {
  const cx = 500, cy = 385, r = 110, rad = a => a * Math.PI / 180;
  const P = (a, rr = r) => [cx + rr * Math.cos(rad(a)), cy - rr * Math.sin(rad(a))];
  const arc = (a1, a2, c) => { const [x1, y1] = P(a1), [x2, y2] = P(a2); return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${c}" stroke-width="24" fill="none"/>`; };
  const txt = (x, y, t, c, anchor) => `<text class="g-l" x="${x}" y="${y}" fill="${c}" text-anchor="${anchor}" dominant-baseline="central">${t}</text>`;
  let s = `<g>${arc(180, 122, '#5CC8FF')}${arc(118, 62, '#3BE0A1')}${arc(58, 0, '#FF6B7A')}
    ${txt(cx - r - 22, cy - 6, 'too dim', '#5CC8FF', 'end')}${txt(cx, cy - r - 30, 'just right', '#3BE0A1', 'middle')}${txt(cx + r + 22, cy - 6, 'too much!', '#FF6B7A', 'start')}
    <text class="g-t" x="${cx}" y="${cy + 30}" text-anchor="middle">LED power meter</text>`;
  if (v != null) {
    const ang = { '-3': 172, '-2': 160, '-1': 140, '0': 90, '1': 40, '2': 18, '3': 8 }[Math.max(-3, Math.min(3, v))];
    const [nx, ny] = P(ang, r - 22);
    s += `<line class="needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"/>`;
  } else s += `<text class="socket-q" x="${cx}" y="${cy - 40}" text-anchor="middle" dominant-baseline="central">?</text>`;
  return s + `<circle cx="${cx}" cy="${cy}" r="10" fill="#fff"/></g>`;
}
function solveResistors(ctx) {
  const R = [{ lv: 1, n: 1, cards: [1, 2, 3] }, { lv: 3, n: 1, cards: [1, 2, 3] }, { lv: 2, n: 1, cards: [3, 1, 2] }, { lv: 3, n: 2, cards: [0, 1, 2, 1] }, { lv: 2, n: 2, cards: [0, 1, 1, 3] }, { lv: 3, n: 3, cards: [1, 2, 0, 1, 1] }, { lv: 2, n: 3, cards: [0, 0, 1, 1, 3] }, { lv: 3, n: 3, cards: [2, 2, 0, 3, 0] }];
  const NAMES = ['Plain wire', 'Small bodyguard', 'Medium bodyguard', 'Big bodyguard'];

  const fs = () => [[.5], [.33, .67], [.22, .5, .78]][R[r].n - 1];
  function slots() {

    return [BAT({ level: c.lv }), ...fs().map((f, k) => {

      const st = c.cards[ci]; return st === 0 ? { type: 'patch', edge: 'T', f } : { type: 'resistor', edge: 'T', f, strength: st };
    }), { type: 'led', edge: 'R', f: .5, color, dir: 1 }];

      `<button class="part${sel === i ? ' sel' : ''}" data-k="${i}"><span class="icon">${partIcon(st === 0 ? { type: 'patch' } : { type: 'resistor', strength: st })}</span><span class="pname">${NAMES[st]}<small>${st} shield${st === 1 ? '' : 's'}</small></span></button>`).join('') ||
      '<p class="traynote">All cards are in the circuit. Tap one to take it back.</p>';
    $$('.part', ctx.tray).forEach(b => { const i = +b.dataset.k; enableDrag(b, {
      targets: () => $$('.slot .hit', ctx.stage).filter(h => { const k = +h.closest('.slot').dataset.i; return k >= 1 && k <= R[r].n; }),
      onDrop: h => put(i, +h.closest('.slot').dataset.i - 1),
      onTap: () => { sel = sel === i ? null : i; drawTray(); if (sel != null) ctx.say('Now tap a spot in the circuit.', 'think'); }

    const res = evalLoop(slots()), str = strength(), V = c.lv * 3; powered = true; drawBoard();
    if (res.status === 'burn') {
      sfx('pop'); ctx.miss(); ctx.mood('bad');
      ctx.say(`POP! ${V} volts is too much for ${str} shield${str === 1 ? '' : 's'}. The LED burned out! Tip: every 3 volts needs 1 shield.`, 'oops', 'bad');
    } else if (res.status === 'dim') {
      sfx('bad'); ctx.miss(); ctx.mood('warn');

    } else {

      ctx.actions([{ label: r < R.length - 1 ? 'Next ›' : 'Finish mission', cls: 'primary', on: () => { if (r < R.length - 1) { r++; start(); } else ctx.win(); } }]);

}

  const slots = () => R[r].slots.map((s, k) => Object.assign({}, fixed[k] || (place[k] != null ? items[place[k]] : { type: 'empty' }), { edge: s[0], f: s[1] }));
  function drawBoard(hl = -1) { ctx.stage.innerHTML = loopSVG({ box: BOX, slots: slots(), res: powered ? res : null, powered, tap: true, badges: true, hl }); }
  function drawTray() {
    ctx.tray.innerHTML = items.map((p, i) => place.includes(i) ? '' :
      `<button class="part${sel === i ? ' sel' : ''}" data-k="${i}"><span class="icon">${partIcon(p)}</span><span class="pname">${p.name}</span></button>`).join('') ||
      '<p class="traynote">The parts box is empty.</p>';
    $$('.part', ctx.tray).forEach(b => { const i = +b.dataset.k; enableDrag(b, {
      targets: () => $$('.slot .hit', ctx.stage),
      onDrop: h => put(i, +h.closest('.slot').dataset.i),
      onTap: () => { sel = sel === i ? null : i; drawTray(); if (sel != null) ctx.say(`Now tap a spot for the ${items[i].type === 'led' ? 'LED' : items[i].name.toLowerCase()}.`, 'think'); }
    }); });
  }
  function drawAll() { drawBoard(); drawTray(); }
  function reset() { powered = false; res = null; ctx.mood(''); }
  function put(i, k) {
    if (done) return;
    if (fixed[k]) { ctx.say('That spot is already taken. Choose an empty spot.', 'think'); return; }
    const prev = place.indexOf(i); if (prev >= 0) place[prev] = null;
    place[k] = i; sel = null; reset(); sfx('drop'); drawAll();
  }
  ctx.stage.onclick = e => {
    if (done) return;
    const fb = e.target.closest('.flipb');
    if (fb) { const k = +fb.dataset.flip, p = fixed[k] || items[place[k]]; p.dir = -(p.dir || 1); sfx('click'); reset(); drawAll(); return; }
    const g = e.target.closest('.slot'); if (!g) return;
    const k = +g.dataset.i;
    if (sel != null) put(sel, k);
    else if (place[k] != null) { place[k] = null; reset(); sfx('pick'); drawAll(); }
    else if (fixed[k]) ctx.say('This part is fixed in place for this round.', 'think');
    else ctx.say('This spot is empty. Drag a part here from the box.', 'think');
  };
  function test() {
    if (done) return;
    const sl = slots();
    if (sl.some(p => p.type === 'empty')) { sfx('bad'); ctx.say('Fill every empty spot first. A gap breaks the loop!', 'think', 'warn'); return; }
    res = evalLoop(sl); powered = true;
    const nm = i => sl[i].type === 'led' ? 'LED' : sl[i].name.toLowerCase();
    let msg = '';
    switch (res.status) {
      case 'works': {
        done = true; drawBoard(); ctx.mood('good');
        const bz = sl.some(p => p.type === 'buzzer'); sfx(bz ? 'buzz' : 'good');
        ctx.say(bz ? 'Beep! Glow! You built a complete, safe circuit with two parts working together.' : r === 3 ? 'Yes! A resistor protects the LED from <b>anywhere</b> in the loop, before it or after it.' : 'It glows! Power source, conductor road and a resistor bodyguard. Great building!', 'wow', 'good');
        ctx.actions([{ label: r < R.length - 1 ? 'Next build ›' : 'Finish mission', cls: 'primary', on: () => { if (r < R.length - 1) { r++; start(); } else ctx.win(); } }]);
        return;
      }
      case 'nopower': msg = 'Nothing happens, because there is no battery! Every circuit needs a power source.'; break;
      case 'blocked': msg = `The ${nm(res.culprit)} is an insulator. Electricity can’t pass through it. Swap it for a conductor!`; break;
      case 'reversed': msg = `The ${nm(res.culprit)} is facing the wrong way. Its + side must face the battery’s + side. Tap ⇄ to flip it!`; break;
      case 'burn': msg = 'POP! The LED burned out, because too much electricity reached it. It needs a resistor bodyguard!'; break;
      default: msg = 'The loop is not complete yet.';
    }
    ctx.miss(); sfx(res.status === 'burn' ? 'pop' : 'bad'); ctx.mood('bad'); drawBoard(res.culprit); ctx.say(msg, 'oops', 'bad');
  }
  start();
}

/* ── TOPIC 7 · LEARN — Breadboards ───────────────────────────────── */
function learnBreadboard(ctx) {
  const EX = [{ type: 'wire', a: 'tp10', b: 'a10' }, { type: 'led', a: 'c10', b: 'c12', color: 'green' }, { type: 'res', a: 'b12', b: 'b16' }, { type: 'wire', a: 'e16', b: 'tn16' }];
  let peek = null, showAll = false, example = false;
  const seen = new Set();
  ctx.ideas([
    'Each column of <b>5 holes</b> (a–e or f–j) is joined by a hidden metal clip.',
    'The <b>+</b> and <b>−</b> rails run along the <b>whole</b> board.',
    'The <b>middle gap</b> separates the top half from the bottom half.',
    'Parts plugged into the <b>same column</b> are connected: no glue or tape needed!'
  ]);
  ctx.goal('Move over the holes, or tap them, to <b>X-ray</b> the breadboard and see its hidden metal clips.');
  ctx.say('A breadboard lets us build circuits quickly. Let’s look inside it!', 'think');
  const ALL_NETS = [...new Set(ALL_HOLES.map(netOf))];
  function draw() {
    const glow = [];
    let parts = '';
    if (showAll) ALL_NETS.forEach(net => glow.push({ net }));
    if (example) {
      const res = evalBB(EX), seenN = new Set();
      ALL_HOLES.forEach(h => { const n = netOf(h); if (!seenN.has(n) && res.roots.has(res.f(n))) { seenN.add(n); glow.push({ net: n, color: '#FFB400' }); } });
      parts = EX.map((p, i) => bbPartSVG(p, i, { on: res.lit.has(i) })).join('');
    }
    if (peek) glow.push({ net: netOf(peek) });
    ctx.stage.innerHTML = boardSVG({ glow, marks: peek ? [{ id: peek }] : [], parts, extra: example ? BB_BATTERY : '' });
  }
  function look(h) {
    if (h === peek) return;
    peek = h; draw(); if (!h) return;
    const k = bbKind(netOf(h)); seen.add(k);
    if (k === 'top' || k === 'bottom') ctx.learn(0); else ctx.learn(1);
    if (seen.has('top') && seen.has('bottom')) ctx.learn(2);
    ctx.say(bbExplain(h), 'happy');
  }
  const holeAt = e => { const svg = $('svg', ctx.stage); if (!svg) return null; const p = svgPt(svg, e); return nearestHole(p.x, p.y); };
  ctx.stage.onpointermove = e => { if (e.pointerType === 'mouse') look(holeAt(e)); };
  ctx.stage.onclick = e => look(holeAt(e));
  function drawTray() {
    ctx.tray.innerHTML = `<button class="chipbtn${showAll ? ' on' : ''}" data-t="all">Show all clips</button><button class="chipbtn${example ? ' on' : ''}" data-t="ex">Example circuit</button>`;
    $$('.chipbtn', ctx.tray).forEach(b => b.onclick = () => {
      sfx('tap');
      if (b.dataset.t === 'all') { showAll = !showAll; if (showAll) { ctx.learn(0); ctx.learn(1); ctx.learn(2); ctx.say('Every clip at once! Columns of 5 in the middle, and long rails at the top and bottom.', 'wow'); } }
      else { example = !example; if (example) { ctx.learn(3); ctx.mood('good'); ctx.say('A real circuit: + rail → wire → LED → resistor → wire → − rail. The yellow glow shows the path through the hidden clips.', 'wow', 'good'); } else ctx.mood(''); }
      draw(); drawTray();
    });
  }
  draw(); drawTray();
}

/* ── TOPIC 7 · SOLVE — Breadboard X-Ray ──────────────────────────── */
function solveBreadboard(ctx) {
  const KINDS = [['top', 'Top strip (a–e)'], ['bottom', 'Bottom strip (f–j)'], ['plus', '+ rail'], ['minus', '− rail']];
  const Q = [
    ['a5', 'd5', true, 'Same column, same half: one hidden metal clip joins all 5 holes a5 to e5.'],
    ['c3', 'c9', false, 'Holes side by side in a letter row are NOT joined. Each column has its own clip.'],
    ['tp2', 'tp18', true, 'The + rail is one long clip that runs along the whole board.'],
    ['tp6', 'tn6', false, 'The + rail and the − rail are separate clips. Joining them would be a short circuit!'],
    ['c12', 'h12', false, 'The gap in the middle splits the top half from the bottom half. c12 and h12 are not joined.'],
    ['f14', 'j14', true, 'Same column in the bottom half: f14 to j14 share one clip.'],
    ['tp4', 'bp4', false, 'The top rails and the bottom rails are separate. You need a wire to join them.'],
    ['tn1', 'tn20', true, 'The − rail runs the whole length of the board: hole 1 and hole 20 are joined.'],
    ['e8', 'f8', false, 'e8 and f8 look very close, but the middle gap separates them.'],
    ['a17', 'e17', true, 'a17 and e17 are the two ends of the same clip.'],
    ['d11', 'd12', false, 'Next-door columns have different clips, so d11 and d12 are not joined.']
  ];
  const TAP = [['b7', ['a7', 'c7', 'd7', 'e7']], ['h15', ['f15', 'g15', 'i15', 'j15']], ['j3', ['f3', 'g3', 'h3', 'i3']]];
  let step = 0, found = new Set(), picked = new Set(), locked = false;
  const total = 1 + Q.length + TAP.length;
  function next() { step++; if (step >= total) { ctx.dots(total); ctx.win(); } else start(); }
  function nextBtn() { ctx.actions([{ label: step < total - 1 ? 'Next ›' : 'Finish mission', cls: 'primary', on: next }]); }
  function start() {
    ctx.dots(step); ctx.mood(''); locked = false; picked = new Set(); ctx.tray.innerHTML = ''; ctx.actions([]);
    if (step === 0) {
      ctx.goal('Tap holes to X-ray the breadboard and see its hidden metal clips. Find all <b>4 kinds</b> of clip.');
      ctx.say('A breadboard lets you build circuits without glue or tape. Tap a hole!', 'think');
      ctx.stage.innerHTML = boardSVG(); drawChips();
    } else if (step <= Q.length) {
      const [a, b] = Q[step - 1];
      ctx.goal(`Are holes <b>A</b> and <b>B</b> connected inside the breadboard?`);
      ctx.say('Think about the hidden clips before you answer.', 'think');
      ctx.stage.innerHTML = boardSVG({ marks: [{ id: a, label: 'A' }, { id: b, label: 'B' }] });
      ctx.actions([{ label: 'Connected', cls: 'primary', on: () => answer(true) }, { label: 'Not connected', on: () => answer(false) }]);
    } else {
      const [star] = TAP[step - 1 - Q.length];
      ctx.goal('Tap <b>every</b> hole that is connected to the star hole ★. Then press <b>Check</b>.');
      ctx.say('Tap a hole again to un-choose it.', 'think');
      drawTap();
      ctx.actions([{ label: 'Check', cls: 'primary', on: checkTap }]);
    }
  }
  function drawChips() {
    ctx.tray.innerHTML = KINDS.map(([k, t]) => `<span class="chip${found.has(k) ? ' on' : ''}">${found.has(k) ? '✓ ' : ''}${t}</span>`).join('');
  }
  function answer(yes) {
    if (locked) return; locked = true;
    const [a, b, conn, why] = Q[step - 1], right = yes === conn;
    const nets = [...new Set([netOf(a), netOf(b)])];
    ctx.stage.innerHTML = boardSVG({ glow: nets.map(net => ({ net })), marks: [{ id: a, label: 'A' }, { id: b, label: 'B' }] });
    if (right) { sfx('good'); ctx.mood('good'); ctx.say(`Correct! ${why}`, 'wow', 'good'); }
    else { ctx.miss(); sfx('bad'); ctx.mood('bad'); ctx.say(`Not quite. ${why}`, 'oops', 'bad'); }
    nextBtn();
  }
  function drawTap(show) {
    const [star, ans] = TAP[step - 1 - Q.length];
    const marks = [{ id: star, cls: 'star', label: '★' }, ...[...picked].map(id => ({ id, cls: show ? (ans.includes(id) ? 'ok' : 'bad') : 'pick' }))];
    if (show) ans.filter(id => !picked.has(id)).forEach(id => marks.push({ id, cls: 'miss' }));
    ctx.stage.innerHTML = boardSVG({ glow: show ? [{ net: netOf(star) }] : [], marks });
  }
  function checkTap() {
    if (locked) return; locked = true;
    const [, ans] = TAP[step - 1 - Q.length];
    const ok = picked.size === ans.length && ans.every(id => picked.has(id));
    drawTap(true);
    if (ok) { sfx('good'); ctx.mood('good'); ctx.say('Perfect! Those 4 holes share one clip with the star hole.', 'wow', 'good'); }
    else { ctx.miss(); sfx('bad'); ctx.mood('bad'); ctx.say('Look at the glowing clip: only the holes in the <b>same column</b> and the <b>same half</b> are connected.', 'oops', 'bad'); }
    nextBtn();
  }
  ctx.stage.onclick = e => {
    const svg = $('svg', ctx.stage); if (!svg) return;
    const pt = svgPt(svg, e), h = nearestHole(pt.x, pt.y); if (!h) return;
    if (step === 0) {
      const n = netOf(h), k = bbKind(n), fresh = !found.has(k); found.add(k); sfx(fresh ? 'on' : 'click');
      ctx.stage.innerHTML = boardSVG({ glow: [{ net: n }], marks: [{ id: h }] }); drawChips();
      if (found.size === KINDS.length) { ctx.mood('good'); ctx.say(`${bbExplain(h)} You found all 4 kinds of clip!`, 'wow', 'good'); nextBtn(); }
      else ctx.say(bbExplain(h), 'happy');
    } else if (step > Q.length && !locked) {
      const [star] = TAP[step - 1 - Q.length]; if (h === star) return;
      picked.has(h) ? picked.delete(h) : picked.add(h); sfx('tap'); drawTap();
    }
  };
  start();
}

/* ── TOPIC 8 · LEARN — Polarity ──────────────────────────────────── */
function learnPolarity(ctx) {
  let dev = 'led', flip = false;

  ctx.goal('Connect the <b>red</b> (+) and <b>blue</b> (−) wires to the LED. Then try it the other way round!');
  ctx.say('Look at the LED’s legs. One is longer than the other. Does that matter?', 'think');
  const M = x => flip ? 1520 - x : x;
  const terms = () => dev === 'led' ? { plus: [M(700), 430], minus: [M(820), 370] } : { plus: [M(700), 400], minus: [M(820), 400] };
  const bench = wireBench(ctx, {

        ctx.mood('good');
        if (dev === 'led') { ctx.learn(1); sfx('good'); ctx.say('It glows! The long leg is connected to the <b>+</b> side. Notice the resistor on the red wire: it protects the LED.', 'wow', 'good'); }
        else { ctx.learn(3); sfx('buzz'); ctx.say('Beep beep! The buzzer’s red + leg is connected to the + side.', 'wow', 'good'); }
      } else if (W.red.at && W.blue.at) {
        if (dev === 'led') ctx.learn(2);
        sfx('bad'); ctx.mood('bad');
        ctx.say(dev === 'led' ? 'Nothing! The LED is backwards. It only lets electricity go <b>one way</b>, from the long leg to the short leg.' : 'Silence! The buzzer is backwards. Find its + side.', 'oops', 'bad');
      } else if (W.red.at || W.blue.at) { ctx.mood('warn'); ctx.say('One wire is on. Connect the other one too.', 'think', 'warn'); }
      else ctx.mood('');

  function drawTray() {

    $$('.chipbtn', ctx.tray).forEach(b => b.onclick = () => {

    });
  }

  drawTray(); bench.draw();
}

/* ── TOPIC 8 · SOLVE — Which Way? ──────────────────────────── */
function solvePolarity(ctx) {
  const R = [
    { k: 'led', flip: false, labels: true, goal: 'Drag the <b>red</b> and <b>blue</b> wire ends onto the LED’s legs. The long leg is the <b>+</b> leg!' },
    { k: 'led', flip: true, goal: 'This LED is turned around and has no labels. Which leg is longer?' },
    { k: 'buzzer', flip: Math.random() < .5, goal: 'Now a <b>buzzer</b>! Find its <b>+</b> side and connect it.' },
    { k: 'loop1', goal: 'The wires are connected, but will the LED glow? Tap <b>⇄</b> to turn parts around, then press <b>Switch ON</b>.' },
    { k: 'loop2', goal: 'Two LEDs! Every LED must face the same way as the battery. Flip parts, then <b>Switch ON</b>.' },
    { k: 'loop3', goal: 'Three LEDs, all dark. Find the <b>one</b> flip that makes them <b>all</b> glow!' },
    { k: 'loop4', goal: 'Two LEDs and a buzzer. Make everything work. Can you do it with only <b>two</b> flips?' }
  ];
  const BOX = { x0: 160, y0: 130, x1: 840, y1: 430 };
  let r = 0;
  function nextBtn() { ctx.actions([{ label: r < R.length - 1 ? 'Next ›' : 'Finish mission', cls: 'primary', on: () => { if (r < R.length - 1) { r++; start(); } else ctx.win(); } }]); }
  function start() {
    const c = R[r]; ctx.dots(r); ctx.goal(c.goal); ctx.mood(''); ctx.actions([]); ctx.stage.onclick = null;
    if (c.k === 'led' || c.k === 'buzzer') wireRound(c); else loopRound(c);
  }
  function wireRound(c) {
    const M = x => c.flip ? 1520 - x : x;
    const T = c.k === 'led' ? { plus: [M(700), 430], minus: [M(820), 370] } : { plus: [M(700), 400], minus: [M(820), 400] };
    let counted = false, done = false;
    ctx.say(r === 0 ? 'The red wire comes from the battery’s + side. The blue wire comes from the − side.' : r === 1 ? 'Look carefully at the two legs.' : 'Buzzers have a + side too, just like LEDs.', 'think');
    wireBench(ctx, {
      label: `Battery, resistor and ${c.k === 'led' ? 'LED' : 'buzzer'}`, terms: () => T, resistor: true, locked: () => done,
      comp: (W, on) => c.k === 'led' ? bigLED(on, M, c.labels) : bigBuzzer(on, M),
      flowing: W => W.red.at === 'plus' && W.blue.at === 'minus',
      onChange(W, on) {
        if (on) {
          done = true; sfx(c.k === 'buzzer' ? 'buzz' : 'good'); ctx.mood('good');
          ctx.say(c.k === 'buzzer' ? 'Beep beep! The buzzer’s + side is connected to the battery’s + side.' : 'It glows! The long leg is connected to the + side of the battery.', 'wow', 'good');
          nextBtn();
        } else if (W.red.at && W.blue.at) {
          if (!counted) { ctx.miss(); counted = true; }
          sfx('bad'); ctx.mood('bad');
          ctx.say(c.k === 'buzzer' ? 'Silence… A buzzer only works one way round. Look for the + mark!' : 'Nothing happens! An LED only lets electricity flow one way. Swap the wires!', 'oops', 'bad');
        } else if (W.red.at || W.blue.at) { ctx.mood('warn'); ctx.say('One wire is on. Now connect the other one to finish the loop.', 'think', 'warn'); }
        else ctx.mood('');
      }
    }).draw();
  }
  function loopRound(c) {
    const slots = {
      loop1: [BAT(), { type: 'resistor', edge: 'T', f: .5 }, { type: 'led', edge: 'R', f: .5, dir: -1, color: 'green', flip: true }],
      loop2: [BAT({ dir: -1, flip: true }), { type: 'resistor', edge: 'T', f: .3 }, { type: 'led', edge: 'T', f: .72, dir: 1, color: 'yellow', flip: true }, { type: 'led', edge: 'B', f: .5, dir: -1, color: 'red', flip: true }],
      loop3: [BAT({ dir: -1, flip: true }), { type: 'led', edge: 'T', f: .25, dir: 1, color: 'green', flip: true }, { type: 'resistor', edge: 'T', f: .62 }, { type: 'led', edge: 'R', f: .5, dir: 1, color: 'yellow', flip: true }, { type: 'led', edge: 'B', f: .5, dir: 1, color: 'red', flip: true }],
      loop4: [BAT({ dir: -1, flip: true }), { type: 'led', edge: 'T', f: .25, dir: 1, color: 'green', flip: true }, { type: 'resistor', edge: 'T', f: .62 }, { type: 'buzzer', edge: 'R', f: .5, dir: -1, flip: true }, { type: 'led', edge: 'B', f: .5, dir: 1, color: 'red', flip: true }]
    }[c.k];
    let powered = false, done = false, res = null;
    const draw = (hl = -1) => { ctx.stage.innerHTML = loopSVG({ box: BOX, slots, res, powered, tap: true, badges: true, hl }); };
    ctx.say({ loop1: 'Check the LED’s legs: the long leg must face the + side of the battery.', loop2: 'You can flip the battery too! Think before you switch on.', loop3: 'Hint: every LED must agree with one special part. Which one?', loop4: 'The buzzer has a + side too! Think about which parts disagree with the battery.' }[c.k], 'think');
    ctx.stage.onclick = e => {
      if (done) return;
      const el = e.target.closest('.flipb') || e.target.closest('.slot'); if (!el) return;
      const i = +(el.dataset.flip ?? el.dataset.i); if (!slots[i].flip) return;
      slots[i].dir = -(slots[i].dir || 1); sfx('click'); powered = false; res = null; ctx.mood(''); draw();
    };
    ctx.actions([{ label: 'Switch ON', cls: 'primary', on: () => {
      if (done) return;
      res = evalLoop(slots); powered = true;
      if (res.status === 'works') {
        done = true; draw(); sfx('good'); ctx.mood('good');
        ctx.say({ loop1: 'Glowing! Now the long leg faces the + side.', loop2: 'Both LEDs glow! They all face the same way as the battery.', loop3: 'All three glow! Every LED now agrees with the battery. Flipping just the battery was the one-flip trick.', loop4: 'Glow and beep! Every part now faces the same way as the battery.' }[c.k], 'wow', 'good'); nextBtn();
      } else { ctx.miss(); sfx('bad'); ctx.mood('bad'); draw(res.culprit); ctx.say('Still dark! The circled part is facing the wrong way.', 'oops', 'bad'); }
    } }]);
    draw();
  }
  start();
}

const CIR = {

// Find every simple path from + (P) to − (N); a bulb on any path lights up.
function solve(C, sw) {

  const deg = {}; [['N', 'P'], ...C.edges].forEach(([u, v]) => { deg[u] = (deg[u] || 0) + 1; deg[v] = (deg[v] || 0) + 1; });

const TOPICS = [
  { name: 'Battery Connection', idea: 'Close the loop from + to −.', learn: learnBattery, solve: { name: 'Close the Loop', play: solveLoop, rounds: 5, stars: [1, 3] } },
  { name: 'Conductors & Insulators', idea: 'Which materials let electricity pass?', learn: learnConductors, solve: { name: 'Conductor Detective', play: solveConductors, rounds: 14, stars: [1, 3] } },
  { name: 'The Electric Wire', idea: 'Copper inside, plastic outside.', learn: learnWire, solve: { name: 'Wire Repair Shop', play: solveWire, rounds: 5, stars: [1, 3] } },
  { name: 'The Dangerous Battery', idea: 'Too much power destroys parts.', learn: learnDanger, solve: { name: 'Safe or Boom?', play: solveDanger, rounds: 14, stars: [1, 3] } },
  { name: 'Resistors', idea: 'A bodyguard that slows electricity.', learn: learnResistors, solve: { name: 'Resistor Bodyguard', play: solveResistors, rounds: 8, stars: [1, 3] } },
  { name: 'The Full Circuit', idea: 'Power + road + protection.', learn: learnFull, solve: { name: 'Circuit Builder', play: solveBuilder, rounds: 5, stars: [1, 3] } },
  { name: 'Breadboards', idea: 'Hidden clips join the holes.', learn: learnBreadboard, solve: { name: 'Breadboard X-Ray', play: solveBreadboard, rounds: 15, stars: [1, 3] } },
  { name: 'Polarity', idea: 'The long leg goes to +.', learn: learnPolarity, solve: { name: 'Which Way?', play: solvePolarity, rounds: 7, stars: [1, 3] } }
].map((t, i) => ({ ...t, n: i + 1 }));
const CHALLENGES = [
  { name: 'Switch Master', idea: 'Series and parallel switches', play: challengeSwitches, rounds: 8, stars: [1, 3] },
  { name: 'Circuit Doctor', idea: 'Find what is broken', play: challengeDoctor, rounds: 10, stars: [1, 3] },
  { name: 'Breadboard Builder', idea: 'Build real circuits', play: challengeBreadboard, rounds: 4, stars: [1, 3] }
].map((c, i) => ({ ...c, n: i + 1 }));
const MAX_BOLTS = (TOPICS.length + CHALLENGES.length) * 3;
const starsFor = (m, [a, b]) => m <= a ? 3 : m <= b ? 2 : 1;
const ICON_LEARN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_SOLVE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>';

let current = null;
function stopCurrent() {
  if (current) { current.timers.forEach(clearTimeout); current = null; }
  $$('.overlay').forEach(o => o.remove());
  $$('.drag-ghost').forEach(o => o.remove());
}

function showMap() {
  const st = getStars(), learned = getLearned(), total = Object.values(st).reduce((a, b) => a + b, 0);
  const nextT = TOPICS.find(t => !st['t' + t.n]);
  const cta = nextT
    ? `<a class="btn primary" href="#t${nextT.n}-${learned[nextT.n] ? 'solve' : 'learn'}">${total || learned[1] ? 'Continue' : 'Start'}: Topic ${nextT.n} ›</a>`
    : '<a class="btn primary" href="#c1">Final challenges ›</a>';
  const bolts = s => `<span class="bolts" aria-label="${s} of 3 bolts">${[1, 2, 3].map(k => BOLT(k <= s)).join('')}</span>`;
  app.innerHTML = `<div class="screen">
    <header class="maphead"><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5 4 13.5h6.5L9 22.5l10-12.5h-6.6z"/></svg>Electricity Lab · Session 2</div>${fsBtn()}${soundBtn()}</header>
    <section class="hero2">
      <div><p class="kicker">Electricity · Grades 4–5</p><h1 class="brand">Circuit <span class="q">Quest</span></h1></div>
      <p class="lede">Every topic has two steps: <span class="lg">${ICON_LEARN}Learn</span> we explore the lab together, then <span class="sv">${ICON_SOLVE}Solve</span> it’s your turn to think!</p>
      <div class="cta">${cta}</div>
      <div class="labmini">
        <div class="bigcell" role="img" aria-label="${total} of ${MAX_BOLTS} bolts collected"><div class="bc-body"><div class="bc-fill" style="width:${total / MAX_BOLTS * 100}%"></div><div class="bc-ticks"></div></div><div class="bc-nub"></div></div>
        <div class="bc-cap"><span>Lab battery</span><span><b>${total}</b> / ${MAX_BOLTS} bolts</span></div>
      </div>
    </section>
    <nav class="topics" aria-label="Topics">${TOPICS.map(t => { const s = st['t' + t.n] || 0; return `<article class="tcard${s ? ' done' : ''}${t === nextT ? ' next' : ''}">
      <div class="mtop"><span class="mnum">${t.n}</span>${learned[t.n] ? '<span class="tag-l">✓ Learned</span>' : ''}</div>
      <h2 class="mname">${t.name}</h2><p class="mdesc">${t.idea}</p>
      <div class="tbtns"><a class="tbtn learn" href="#t${t.n}-learn">${ICON_LEARN}Learn</a><a class="tbtn solve" href="#t${t.n}-solve"><span>${ICON_SOLVE}Solve</span>${bolts(s)}</a></div>
    </article>`; }).join('')}</nav>
    <section class="finals" aria-label="Final challenges"><h2 class="finals-h">Final<br>challenges</h2>${CHALLENGES.map(c => `<a class="fcard" href="#c${c.n}"><span class="mnum">${c.n}</span><span><b>${c.name}</b><small>${c.idea}</small></span>${bolts(st['c' + c.n] || 0)}</a>`).join('')}</section>
  </div>`;
}

// One frame for every screen: header · goal · stage (+ ideas panel) · dock
function openScreen(kind, n) {
  const learn = kind === 'learn', chal = kind === 'challenge';
  const item = chal ? CHALLENGES[n - 1] : TOPICS[n - 1];
  const key = (chal ? 'c' : 't') + n;
  const title = learn ? item.name : chal ? item.name : item.solve.name;
  const eyebrow = chal ? `<span class="mode challenge">Challenge</span>Final challenge ${n} of ${CHALLENGES.length}`
    : `<span class="mode ${kind}">${learn ? 'Learn' : 'Solve'}</span>Topic ${n} of ${TOPICS.length}${learn ? '' : ' · ' + item.name}`;
  const swap = chal ? '' : learn ? `<a class="btn primary small" href="#t${n}-solve">${ICON_SOLVE}Solve it ›</a>` : `<a class="btn ghost small" href="#t${n}-learn">${ICON_LEARN}Learn</a>`;
  app.innerHTML = `<div class="screen ${kind}">
    <header class="lvhead">
      <a class="btn ghost small" href="#map">‹ Map</a>
      <div class="lvtitle"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>
      <div class="dots" id="dots" role="img" aria-label="Progress"></div>
      ${swap}${fsBtn()}${soundBtn()}
    </header>
    <p class="goal" id="goal"></p>
    <main class="stagebox"><div class="stagecell"><div class="stage" id="stage"></div></div>${learn ? '<aside class="ideas" id="ideas" aria-label="What we discover"></aside>' : ''}</main>
    <footer class="dock">
      <div class="talk"><div id="vbox">${volty()}</div><div class="bubble" id="bubble" aria-live="polite"></div></div>
      <div class="tray" id="tray"></div>
      <div class="actions" id="actions"></div>
    </footer>
  </div>`;
  const stage = $('#stage'), bubble = $('#bubble');
  let ideaList = null; const found = new Set();
  const ctx = current = {
    mistakes: 0, timers: [], stage, tray: $('#tray'),
    goal(h) { $('#goal').innerHTML = `<span>${h}</span>`; },
    say(h, mood = 'happy', tone = '') { bubble.innerHTML = `<span>${h}</span>`; bubble.className = 'bubble ' + tone; $('#vbox').innerHTML = volty(mood); },
    dots(i, total = chal ? item.rounds : item.solve.rounds, fade = true) {
      if (fade) { stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter'); }
      $('#dots').innerHTML = Array.from({ length: total }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('');
      $('#dots').setAttribute('aria-label', `Round ${Math.min(i + 1, total)} of ${total}`);
    },
    mood(c) { stage.classList.remove('good', 'bad', 'warn'); if (c) stage.classList.add(c); },
    actions(list) {
      const a = $('#actions'); a.innerHTML = '';
      list.forEach(b => { const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.innerHTML = b.label; el.onclick = () => { Snd.ac(); b.on(); }; a.appendChild(el); });
    },
    miss() { this.mistakes++; },
    later(fn, ms) { const id = setTimeout(fn, ms); this.timers.push(id); return id; },
    // Learn labs: a list of ideas that light up as they are discovered
    ideas(list) { ideaList = list; found.clear(); renderIdeas(); },
    learn(i) {
      if (!ideaList || found.has(i)) return;
      found.add(i); sfx('idea'); renderIdeas(i);
      if (found.size === ideaList.length) setLearned(n);
    },
    win() {
      const s = starsFor(this.mistakes, item.stars || item.solve.stars); saveStars(key, s); sfx('win'); confetti();
      const [href, label] = chal
        ? (n < CHALLENGES.length ? [`#c${n + 1}`, 'Next challenge ›'] : ['#map', 'Back to the map'])
        : (n < TOPICS.length ? [`#t${n + 1}-learn`, `Next: Topic ${n + 1} ›`] : ['#c1', 'Final challenges ›']);
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.innerHTML = `<div class="wincard" role="dialog" aria-modal="true" aria-labelledby="wt">${volty('wow')}
        <h2 id="wt">${['', 'Mission complete!', 'Great work!', 'Super engineer!'][s]}</h2>
        <div class="winbolts">${[1, 2, 3].map(k => BOLT(k <= s)).join('')}</div>
        <p>${s < 3 ? `You made ${this.mistakes} mistakes. Play again to earn all 3 bolts!` : this.mistakes ? `Only ${this.mistakes} mistake${this.mistakes === 1 ? '' : 's'}: you earned all 3 bolts!` : 'Perfect! No mistakes, and all 3 bolts are yours.'}</p>
        <div class="actions"><button class="btn ghost" data-a="again">Play again</button><a class="btn primary" href="${href}">${label}</a></div></div>`;
      document.body.appendChild(ov);
      $('[data-a="again"]', ov).onclick = () => { stopCurrent(); openScreen(kind, n); };
      $('.btn.primary', ov).focus();
    }
  };
  function renderIdeas(fresh) {
    const box = $('#ideas'); if (!box || !ideaList) return;
    const all = found.size === ideaList.length;
    box.innerHTML = `<h2>What we discover <span>${found.size}/${ideaList.length}</span></h2><ol>${ideaList.map((t, i) => {
      const on = found.has(i);
      return `<li><button class="idea${on ? ' on' : ''}${fresh === i ? ' fresh' : ''}" data-idea="${i}"${on ? ' disabled' : ' title="Reveal this idea"'}><span class="inum">${on ? '✓' : i + 1}</span><span>${on ? t : 'Discover it in the lab…'}</span></button></li>`;
    }).join('')}</ol>${all ? `<a class="btn primary small ready" href="#t${n}-solve">Ready? Solve it ›</a>` : ''}`;
    $$('[data-idea]', box).forEach(b => b.onclick = () => ctx.learn(+b.dataset.idea));
    ctx.dots(found.size, ideaList.length, false);
  }
  if (learn) item.learn(ctx); else (chal ? item.play : item.solve.play)(ctx);
}

// Old addresses (#m1 … #m10) from the first version still work
const LEGACY = { m1: '#t1-solve', m2: '#t2-solve', m3: '#t3-solve', m4: '#t8-solve', m5: '#t5-solve', m6: '#t6-solve', m7: '#t7-solve', m8: '#c1', m9: '#c2', m10: '#c3' };
function route() {
  stopCurrent();
  const h = location.hash;
  if (LEGACY[h.slice(1)]) { location.replace(LEGACY[h.slice(1)]); return; }
  let m;
  if ((m = /^#t(\d+)-(learn|solve)$/.exec(h)) && TOPICS[+m[1] - 1]) openScreen(m[2], +m[1]);
  else if ((m = /^#c(\d+)$/.exec(h)) && CHALLENGES[+m[1] - 1]) openScreen('challenge', +m[1]);
  else showMap();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fs]');
  if (f) { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); return; }
  const b = e.target.closest('[data-snd]'); if (!b) return;
  Snd.muted = !Snd.muted; const d = Store.get(); d.muted = Snd.muted; Store.set(d);
  b.outerHTML = soundBtn(); if (!Snd.muted) sfx('tap');
});
window.addEventListener('hashchange', route);
document.addEventListener('fullscreenchange', () => $$('[data-fs]').forEach(b => { b.outerHTML = fsBtn(); }));
route();
})();
</script>
</body>
</html>
